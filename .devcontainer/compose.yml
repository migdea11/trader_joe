# Agent container for trader_joe — tailored in phase E from the phase A0 bootstrap image.
#
# The project name is explicit. Compose otherwise names a project after the directory holding its
# first compose file — `.devcontainer`, in every project — so every project would share one
# container name, and each project's `up` would replace the previous project's container.
#
# Snake case, matching project.name in .claude/workflow.yml and the repo directory. The project is
# spelled trader_joe everywhere else in this repo; a second spelling here bought nothing and made
# the generated container and volume names hard to search for.
name: trader_joe_agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      # The project itself.
      - ..:/workspace:cached

      # The kit, read-only: a project session must never write to it. The default keeps an unset
      # variable from expanding to an empty source and producing a silently broken mount.
      - ${AGENT_KIT_PATH:-$HOME/repos/agent-workflow}:/kit:ro

      # Host credentials, as a single file — rendered by workflow-init only when that file exists,
      # because a bind mount whose source is missing makes Docker create it on the host as a
      # root-owned directory. Never mount the whole host config directory: the entrypoint writes
      # skill symlinks pointing at /kit, which does not exist on the host.
      - ${HOME}/.claude.json:/home/agent/.claude.json

      # Agent config and session state — the chat transcripts live here. A host directory and
      # deliberately not a named volume: a volume is deleted by `docker volume prune`, and is
      # orphaned outright if the compose project name changes, which is how every session before
      # 2026-09-20 was stranded. Outside the repo, because this directory holds .credentials.json
      # and this repo is public — and because `git clean -xdf` would take it. The host path is
      # created by initializeCommand in devcontainer.json: Docker creates a missing bind source
      # as a root-owned directory, and the entrypoint then cannot write its skill symlinks.
      - ${AGENT_HOME_PATH:-$HOME/.claude-agent-homes/trader_joe}:/home/agent/.claude
    environment:
      - CLAUDE_CONFIG_DIR=/home/agent/.claude

      # bd reports usage telemetry unless told not to, and its own config file lives outside the
      # persistent config directory — so this variable is the only opt-out that survives a rebuild.
      - BD_DISABLE_METRICS=1

      # Git identity. The container has no ~/.gitconfig, so without this every agent commit fails
      # with "unable to auto-detect email address" and each one works around it separately. These
      # are the identity already on this repo's commits, and are public in its history.
      - GIT_AUTHOR_NAME=Miguel
      - GIT_AUTHOR_EMAIL=migdea11@gmail.com
      - GIT_COMMITTER_NAME=Miguel
      - GIT_COMMITTER_EMAIL=migdea11@gmail.com

      # Tests import psycopg2/asyncpg only when these are set; CI sets them and the Makefile does
      # not, which is why a bare `make test` fails. Set here so an agent's run matches CI.
      - POSTGRES_ASYNC=true
      - POSTGRES_SYNC=true

      # The container's own uv environment, never the host's .venv (tj-3t2axg). /workspace is the
      # host checkout bind-mounted in, so one shared .venv had each side's uv point bin/python at an
      # interpreter only it has (/opt/uv/python here); the other side's next `uv run` then rebuilt
      # the venv with default-groups only. Relative on purpose: uv resolves it against the project
      # root, so each agent worktree keeps its own. The Makefile's VENV_DIR reads this same
      # variable, so its sync marker follows it. Ignored in .gitignore, .dockerignore and ruff.
      - UV_PROJECT_ENVIRONMENT=.venv-devcontainer
    command: ["sleep", "infinity"]
    networks:
      # default keeps this project's own network, and with it the agent's own egress.
      # devnet is dev reach (decision record tj-q9ae5u, addendum 1): the dev stack joins it through
      # docker-compose.override.yaml, so from here postgres (or its container name,
      # DATABASE_NAME), kafka, data_store and data_ingest resolve by name. A prod launch never
      # attaches devnet, so this reaches no prod stack on the same machine. The agent has no
      # Docker -- no socket, no CLI -- so this is for reaching services by name, not for running
      # the system suite.
      - default
      - devnet

# External with a fixed name: owned by neither this project nor the stack's, and created
# idempotently by the initializeCommand in devcontainer.json and by `make dev-network`
# (a prerequisite of agent-up), so either side can start first and neither side's down removes
# it. trader_joe_devnet appears in exactly four places, which must agree: this file,
# docker-compose.override.yaml, the Makefile's DEV_NETWORK and the initializeCommand.
networks:
  devnet:
    external: true
    name: trader_joe_devnet
