[pytest]
asyncio_default_fixture_loop_scope = function
# pytest does not honour .gitignore, and the container volume mounts are root-owned,
# so collection dies on PermissionError before a single test runs. Defaults restated
# because assigning norecursedirs replaces them rather than extending them.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} volumes volume_data