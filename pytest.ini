[pytest]
asyncio_default_fixture_loop_scope = function
# pytest does not honour .gitignore, and the container volume mounts are root-owned,
# so collection dies on PermissionError before a single test runs. Defaults restated
# because assigning norecursedirs replaces them rather than extending them.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} volumes volume_data

# ---------------------------------------------------------------------------------------
# MARKERS (tj-32cltb, ADR tj-fdb9gz)
#
# Four component markers, named from how the code is actually laid out so nobody has to
# translate, plus exactly one non-component marker.
#
# THE MARKING RULE, one sentence: a test carries the marker of the component whose
# interface it DRIVES -- the entry point it calls -- regardless of which top-level
# directory the test file or the code under test happens to sit in.
#
# CROSS-COMPONENT TESTS take the marker of the component being driven, never of the
# components passed through. A data_store test that reaches through common/kafka is
# data_store; common is not added.
#
# There is deliberately NO `routers` marker and NO `schemas` marker. Neither is a
# component; each is a layer inside every component.
#
# WHAT UNMARKED MEANS: "not yet attributed to a component". Tolerated, not blessed. An
# unmarked test STILL RUNS IN THE PR GATE -- it simply cannot be picked out by a component
# selection. That preserves the property that matters: forgetting a marker never drops a
# test out of the gate. Nothing here enforces marker presence, and nothing should until
# unattributed tests actually accumulate.
#
# `external` is named `external` and not `broker` on purpose: a FakeBroker contract test
# (tj-3odjhr) is a broker-component test that needs nothing and must run in the gate, and a
# marker named `broker` would sweep it out. The mismatch with the `make test-broker` target
# name is the lesser cost, and is recorded here so it is not read as an oversight.
#
# NOT EXPRESSIBLE, and this is deliberate: Postgres, Kafka, a running stack and docker are
# not markers under this scheme. There is no needs_postgres and no needs_stack. Those
# concerns belong to the CI System Testing job (tj-6bvoic, tj-0qxnzw). POSTGRES_ASYNC and
# POSTGRES_SYNC are likewise not markers -- they are import-time feature flags in
# common/database/postgres_tools.py choosing which driver is imported, and say nothing
# about whether a database is reachable.
markers =
    common: drives the shared library's own surface -- common/, routers/common, schemas/common
    data_store: drives the data_store service's interface -- data/store/ (app, migrations), routers/data_store, schemas/data_store
    data_ingest: drives the data_ingest service's interface -- data/ingest/ (app), routers/data_ingest, schemas/data_ingest
    build_infra: checks the repository's own build and CI configuration -- Makefile, Dockerfile, the compose files, .github/workflows, pyproject.toml, pytest.ini
    external: requires a live third-party account answering over the network. NOT in the PR gate. Run by hand: make test-broker

# ---------------------------------------------------------------------------------------
# ADDOPTS
#
# -m "not external" IS THE PR GATE, and it lives here rather than in a make target because
# CI does not go through make: .github/workflows/trader_joe_testing.yml runs `uv run pytest`
# directly. addopts is prepended to the command line and the last -m wins, so a make target
# that passes its own -m still overrides this one. One place that both make and CI read; an
# -m per make target plus an edited CI step would be two places that must agree, and the CI
# one is the one that drifts.
#
# Deselection is otherwise INVISIBLE: the only evidence that tests were filtered out is the
# "N deselected" in pytest's summary line. If you are hunting for a test that seems not to
# run, read that number before you read anything else.
#
# --strict-markers turns an undeclared marker into a collection error. Without it,
# @pytest.mark.data_stor is a silent no-op that leaves the test out of every component
# selection -- a test that exists, passes, and is invisible to the person running its
# component. Note what it does NOT do: it catches a MISSPELLED marker, never a MISSING one.
# --strict-config is its companion, for this file.
#
# -ra prints every skip and its reason in the summary. Under the fail-never-skip rule below
# this suite should contain a handful of skips at most -- two sites today -- so a NEW skip
# shows up in the run output instead of only in a diff nobody reviews line by line. It is the
# only automatic detector that rule has.
#
# --continue-on-collection-errors CONTAINS A COLLECTION ERROR TO ITS OWN FILE. Without it,
# pytest cancels the WHOLE run on the first one: at fc377e4 a data_store manifest guard raised
# during collection and zero of 231 tests ran -- common, schemas, routers and data_ingest all
# lost to a guard that has nothing to do with them. With it, that same guard still errors, the
# erroring file is still named, the exit code is still non-zero, and every unrelated test still
# reports. It changes blast radius, not verdict; nothing is masked.
#
# THE CONDITION THAT COMES WITH IT: ANY GATE MUST KEY ON THE EXIT CODE, NEVER ON READING THE
# SUMMARY LINE. With this flag a run can print "231 passed" with an error above it, so a reader
# -- human or agent -- who reports "passed" from the summary text is laundering a collection
# failure. make test propagates pytest's status; a CI job must assert on the status too.
addopts = --strict-markers --strict-config -ra --continue-on-collection-errors -m "not external"

# ---------------------------------------------------------------------------------------
# FAIL, NEVER SKIP (ADR tj-fdb9gz, affirmed by the user 2026-09-23)
#
# * A test that is not selected is DESELECTED, and pytest prints the count.
# * A test that IS selected and finds its resource missing FAILS. It does not probe and
#   skip. No pytest.importorskip, no try-to-connect-skip-on-ConnectionError, no autouse
#   fixture that skips when a credential is unset.
# * WHY: this project's recorded failures are all one shape -- a green result that asserted
#   nothing. tj-0qxnzw (a System Testing job that ran `docker ps` and exited 0 on an empty
#   list), tj-06uflo (a .PHONY-less target reporting success having run nothing), both
#   test_app_import.py files (a suite that stayed green through two import-time breakages
#   because nothing imported an app main module). A skip on a missing credential is that
#   same failure in a new place.
# * AND THE SMALLNESS MAKES IT WORSE, NOT BETTER. A set that is tiny and runs rarely is a
#   set nobody watches. Small + rare + skips quietly = a set that has effectively never run,
#   and no one finds out. Small + rare + fails = it either ran, or it was red. The rule that
#   external tests stay a minimal cross-section is what turns fail-not-skip from a
#   preference into a requirement.
# * THE RULE THAT DECIDES IT, and it is the invariant, not the list below: SKIP OVER A CASE
#   THAT IS NOT THERE; FAIL OVER A RESOURCE THAT SHOULD BE. A legitimate skip is one where
#   there is nothing to assert about, because the case itself does not exist. Anything that
#   skips because a resource, credential or service is missing is the failure shape above.
#   The sites that qualify today are EXAMPLES of the rule, not exceptions to it:
#     - common/tests/test_ci_invariants.py skips a parametrized workflow that is not
#       branch-triggered.
#     - data/store/tests/test_http_smoke.py skips its unbound-path placeholder when the
#       manifest declares no unbound-path entries (tj-wc4pe8) -- an empty category there is
#       the desired end state, not a missing resource.
#   A new site is legitimate if it passes the rule; adding one should not require editing
#   this prose to keep it honest. Keep the count small anyway: -ra above is what surfaces a
#   new skip, and it only helps while the list is short enough to read.
# * FOR AGENTS: an agent cannot run `make test-broker` -- it needs a live credential, and a
#   credential is forbidden in a branch-triggered workflow (tj-59cce6). An agent that cannot
#   run a target reports it as NOT RUN with the reason, per CLAUDE.md. Never as passed, and
#   never converted into a skip to make the run green.
