// THE UI'S LIVE-EVENT VOCABULARY, PHASE 2 (tj-grna9p.70): what /ui/v1/events pushes. A client
// treats every event as a hint to reload, so an event carries the changed object rather than a
// diff. There is no settings event: settings live in the browser. No credential material crosses.
syntax = "proto3";

package trader_joe.proto.ui.v1;

import "google/protobuf/timestamp.proto";
import "trader_joe/proto/ui/v1/data.proto";
import "trader_joe/proto/ui/v1/ops.proto";

enum DatasetChange {
  DATASET_CHANGE_UNSPECIFIED = 0;
  DATASET_CHANGE_CREATED = 1;
  DATASET_CHANGE_UPDATED = 2;
  // The dataset stopped collecting (its collect intent became false).
  DATASET_CHANGE_RETIRED = 3;
  // The dataset is collecting again (its collect intent became true).
  DATASET_CHANGE_RESUMED = 4;
  DATASET_CHANGE_DELETED = 5;
}

message DatasetChanged {
  // The dataset's UUID, as text.
  string id = 1;
  DatasetChange change = 2;
}

message IngestRunChanged {
  IngestRun run = 1;
}

message RequestChanged {
  RequestLogEntry entry = 1;
}

// The reaper's pending set changed: a dataset's expiry passed, or a pending dataset was deleted,
// retired or resumed. A notification, not data: reload GET /ui/v1/reaper/pending or the affected
// lists. Sent in dry-run too; whether deletions are enabled is ReaperPendingPage.deletes_enabled.
message ReaperPendingChanged {}

message UiEvent {
  // The server's clock when the event was sent.
  google.protobuf.Timestamp server_time = 1;
  oneof event {
    DatasetChanged dataset_changed = 2;
    IngestRunChanged ingest_run_changed = 3;
    RequestChanged request_changed = 4;
    ReaperPendingChanged reaper_pending_changed = 5;
  }
}
