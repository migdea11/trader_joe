// THE UI'S DATA VOCABULARY, PHASE 1 (tj-grna9p.14): datasets, their facets, and bar pages, as the
// web UI reads them over /ui/v1 (canonical protobuf JSON). It imports the shared market vocabulary
// (market/v1) and never restates a Bar or an enum from it. Later phases add messages and fields
// ADDITIVELY -- buf breaking runs against main for this package -- so nothing here is renumbered.
//
// HALF-OPEN RANGES. Every range in this file is [start, end): the start is included and the end is
// excluded, matching the store (tj-86g751). A range is never empty or inverted: end is after start.
//
// NO CREDENTIAL MATERIAL crosses here, and none may be added: owner is a free-text label, not a key.
syntax = "proto3";

package trader_joe.proto.ui.v1;

import "google/protobuf/timestamp.proto";
import "trader_joe/proto/market/v1/bar.proto";
import "trader_joe/proto/market/v1/enums.proto";

// How a dataset's rows expire. Mirrors common.enums.data_stock.ExpiryType by member NAME. It is
// defined here, not in market/v1, because only the UI contract carries it (tj-grna9p.14); the zero
// value exists for proto3 only and is never a real expiry type.
enum ExpiryType {
  EXPIRY_TYPE_UNSPECIFIED = 0;
  EXPIRY_TYPE_BULK = 1;
  EXPIRY_TYPE_BUFFER_1K = 2;
  EXPIRY_TYPE_BUFFER_10K = 3;
  EXPIRY_TYPE_BUFFER_100K = 4;
  EXPIRY_TYPE_ROLLING = 5;
}

// Whether the dataset is being kept. RETIRED is a DAILY or STREAM subscription whose collect intent
// is false: it is not being scheduled; deletion is its expiry, separately.
enum DatasetState {
  DATASET_STATE_UNSPECIFIED = 0;
  DATASET_STATE_ACTIVE = 1;
  DATASET_STATE_RETIRED = 2;
}

// The server's computed judgement of how current or complete a dataset is. Computed on read, never
// stored (tj-grna9p.8). The UI words differ: OVERDUE is shown as Failed, LATE as Late, and so on.
enum FreshnessStatus {
  FRESHNESS_STATUS_UNSPECIFIED = 0;
  // DAILY or STREAM: the last bar is at or after expected_last_bar.
  FRESHNESS_STATUS_FRESH = 1;
  // DAILY: awaiting the next session's collection deadline; not yet a failure.
  FRESHNESS_STATUS_LATE = 2;
  // A missed collection deadline: a failure. Named OVERDUE, not STALE, because the UI uses Stale
  // for datasets nobody reads (usage), which is a different thing.
  FRESHNESS_STATUS_OVERDUE = 3;
  // STATIC: every session in [start, end) has at least one bar.
  FRESHNESS_STATUS_COMPLETE = 4;
  // STATIC: some sessions in [start, end) have no bar; see gap_count.
  FRESHNESS_STATUS_GAPS = 5;
  // A DAILY or STREAM subscription whose collect intent is false: it is not being scheduled, so it
  // owes no freshness; deletion is its expiry, separately.
  FRESHNESS_STATUS_RETIRED = 6;
}

// Freshness or completeness of one dataset, computed over its trading calendar at as_of.
message Freshness {
  FreshnessStatus status = 1;
  // DAILY and STREAM only, and not a session close. DAILY: the local midnight (calendar time zone)
  // of the expected period's first day, i.e. the timestamp its bar carries. For 1day that day is
  // the session that should be stored; for 1week and 1month it is the first calendar day of the
  // period (Monday, or the 1st), which may not be a session. STREAM: the oldest last-bar instant
  // that still reads FRESH.
  google.protobuf.Timestamp expected_last_bar = 2;
  // STATIC only (status GAPS): how many sessions in [start, end) have no bar. Zero otherwise.
  int32 gap_count = 3;
  // The server time this was computed at.
  google.protobuf.Timestamp as_of = 4;
}

// The same series at another bar width, so the UI can offer a switch without a second listing.
message DatasetSibling {
  string id = 1;
  trader_joe.proto.market.v1.Granularity granularity = 2;
}

// One dataset, as the catalog lists it and the viewer opens it.
message DatasetSummary {
  // The dataset's UUID, as text.
  string id = 1;
  string asset_symbol = 2;
  trader_joe.proto.market.v1.AssetType asset_type = 3;
  trader_joe.proto.market.v1.DataType data_type = 4;
  trader_joe.proto.market.v1.DataSource source = 5;
  trader_joe.proto.market.v1.Feed feed = 6;
  trader_joe.proto.market.v1.Granularity granularity = 7;

  // The requested range, half-open [start, end): start included, end excluded. end is always set;
  // for an open-ended dataset it is the server time of the read, or one microsecond after start when the
  // dataset starts in the future (end is never before start).
  google.protobuf.Timestamp start = 8;
  google.protobuf.Timestamp end = 9;

  trader_joe.proto.market.v1.UpdateType update_type = 10;
  ExpiryType expiry_type = 11;
  // When the dataset is deleted. Unset only when nothing is scheduled.
  google.protobuf.Timestamp expiry = 12;
  // A free-text label for who asked for the dataset ('operator' for the UI). Never a credential.
  string owner = 13;
  DatasetState state = 14;

  // The stored data's extent. first_bar and last_bar are bar_start times of the first and last bar
  // (inclusive, so last_bar is NOT the exclusive end of a range). Unset when bar_count is zero.
  google.protobuf.Timestamp first_bar = 15;
  google.protobuf.Timestamp last_bar = 16;
  int64 bar_count = 17;

  Freshness freshness = 18;

  // Other granularities held for the same symbol, source, feed and data type. Excludes this one.
  repeated DatasetSibling siblings = 19;

  // The dataset's most recent collection run, whatever its state. Unset when it has never run
  // (tj-grna9p.70, phase 2).
  IngestRun last_run = 20;

  // How the dataset has been read, over the clients selected by the request's client filter
  // (tj-grna9p.84, phase 3). Always set on a list or detail read.
  DatasetUsage usage = 21;

  // The reaper would delete this dataset: its expiry has passed. True in dry-run too, where nothing
  // is deleted until deletes are enabled. Set on list and detail reads; drives the Expiring Soon
  // flag and the detail banner.
  bool reaper_pending = 22;

  // Whether the dataset is being collected. Derived, for every update type: for a DAILY or STREAM
  // subscription it is the operator's collect intent (false = RETIRED); for STATIC it means a fetch
  // is in progress. Presence is meaningful, hence optional.
  optional bool collecting = 23;
}

// One page of the catalog. Keyset paging over (asset_symbol, id); the cursor is opaque.
message DatasetPage {
  repeated DatasetSummary items = 1;
  // Pass back to fetch the next page; empty on the last page.
  string next_cursor = 2;
}

// A count for one filter value, over the datasets matching the other active filters.
message SourceFacet {
  trader_joe.proto.market.v1.DataSource source = 1;
  int64 count = 2;
}

message UpdateTypeFacet {
  trader_joe.proto.market.v1.UpdateType update_type = 1;
  int64 count = 2;
}

message StatusFacet {
  FreshnessStatus status = 1;
  int64 count = 2;
}

// The sidebar's counts: per saved view and per filter option, so a count always equals the total
// the matching list would return.
message DatasetFacets {
  // The All Datasets view.
  int64 all = 1;
  // The Needs Attention view: freshness LATE, OVERDUE or GAPS (the UI's Late or Failed, tj-grna9p.60).
  int64 needs_attention = 2;
  repeated SourceFacet sources = 3;
  repeated UpdateTypeFacet update_types = 4;
  repeated StatusFacet statuses = 5;
  // Datasets with a run in state RUNNING right now (tj-grna9p.70, phase 2).
  int64 running = 6;
  // The clients that have read any dataset, for the usage client picker (phase 3). Counts datasets
  // each client read in the last 30 days; ignores the client filter so the picker never empties itself.
  repeated ClientCount clients = 7;

  // The usage counts (stale, read_30d, never_read) honour the client filter and stale_days;
  // expiring_soon ignores the client filter (it is expiry-based). Like every count here, each counts
  // over the datasets matching the other active filters. The facets route takes expires_before like
  // the list; when absent the server uses now + 7 days (one named server constant, echoed in
  // expires_before).

  // Echo of the client filter applied, per the ECHO RULE in the CLIENT FILTER comment: exactly one
  // of client_ids and client_kinds is non-empty.
  repeated string client_ids = 8;
  repeated ClientKind client_kinds = 9;
  // The Stale view and the Usage group's Stale option: same rule as USAGE_FILTER_STALE (no read by
  // the selected clients in the last stale_days, never-read included).
  int64 stale = 10;
  // Usage group: read by the selected clients in the last 30 days. The same figure as
  // UsageSummary.read_last_30d in stats.proto, under a different name.
  int64 read_30d = 11;
  // Usage group: never read by the selected clients.
  int64 never_read = 12;
  // The Expiring Soon view: datasets whose expiry is before expires_before, PLUS every dataset in
  // the reaper's pending set (reaper_pending).
  int64 expiring_soon = 13;
  // Echo: the staleness threshold used, in days.
  int32 stale_days = 14;
  // Echo: the expires_before bound used.
  google.protobuf.Timestamp expires_before = 15;
}

// One page of a dataset's bars, ascending by bar_start, within the requested half-open [start, end).
message BarPage {
  repeated trader_joe.proto.market.v1.Bar bars = 1;
  // Pass back to fetch the next page; empty on the last page.
  string next_cursor = 2;
}

// Where one chart page of a bar window starts (tj-eozqhi).
message BarPageStart {
  // bar_start of the page's first bar; read the page's bars with start = this, end = the window's end.
  google.protobuf.Timestamp start = 1;
  // The page's first bar as a 0-based position among the window's bars, ascending by bar_start.
  int64 offset = 2;
}

// The page index of a bar window [start, end), half-open (tj-eozqhi). Pages are fixed blocks of
// page_size bars counted back from the newest bar; with r = bar_count mod page_size the offsets are
// [0 when r > 0], r, r + page_size, ..., bar_count - page_size, and a window of at most page_size bars
// is the single page [0]. The earliest page (offset 0) holds page_size bars and so overlaps the next
// block. overlap is the look-ahead a client adds from the next block; it does not move the offsets.
// The page count is pages.length, exact.
message BarPageIndex {
  // Bars in the half-open window [start, end).
  int64 bar_count = 1;
  // The page size the index was cut with, in bars.
  int32 page_size = 2;
  // The look-ahead the client adds from the next block, in bars, as asked for.
  int32 overlap = 3;
  // Ascending by offset; empty when bar_count is 0, one entry when bar_count <= page_size.
  repeated BarPageStart pages = 4;
}

// PHASE 2 (tj-grna9p.70): collection runs and the request body. Additive to everything above.

// What started a collection run.
enum RunTrigger {
  RUN_TRIGGER_UNSPECIFIED = 0;
  // A person (or a strategy) asked for the dataset.
  RUN_TRIGGER_REQUEST = 1;
  // The daily pass collected it.
  RUN_TRIGGER_SCHEDULE = 2;
  // A retry of an earlier run.
  RUN_TRIGGER_RETRY = 3;
}

enum IngestRunState {
  INGEST_RUN_STATE_UNSPECIFIED = 0;
  INGEST_RUN_STATE_RUNNING = 1;
  INGEST_RUN_STATE_SUCCEEDED = 2;
  // The vendor answered and held no bars for the range.
  INGEST_RUN_STATE_EMPTY = 3;
  INGEST_RUN_STATE_FAILED = 4;
}

// Why a run failed. domain and reason are the server's typed error vocabulary (docs/errors.md);
// message is human text and carries no credential material.
message IngestRunError {
  string domain = 1;
  string reason = 2;
  string message = 3;
}

// One attempt to collect a dataset.
message IngestRun {
  // The run's UUID, as text.
  string id = 1;
  // The dataset's UUID, as text. EMPTY until the run's acknowledgement: a new dataset's entry is
  // written when the fetch is accepted, so the id does not exist before then.
  string dataset_id = 2;
  // The dataset's display label (symbol and granularity), so a run lists without a join.
  string label = 3;
  RunTrigger trigger = 4;
  // A free-text label for who caused the run; never a credential.
  string actor = 5;
  // The range the run asked for, half-open [start, end): start included, end excluded. end is
  // unset for an open-ended request.
  google.protobuf.Timestamp start = 6;
  google.protobuf.Timestamp end = 7;
  IngestRunState state = 8;
  int64 bars_written = 9;
  // Set only when state is FAILED.
  IngestRunError error = 10;
  google.protobuf.Timestamp started_at = 11;
  // Unset while RUNNING.
  google.protobuf.Timestamp finished_at = 12;
  // The request-log entry that caused the run, as text. Empty for a scheduled run.
  string request_id = 13;
  // The quota scope the run was charged to: a non-secret configured label, never key material.
  string quota_key = 14;
}

// One page of runs. Keyset paging; the cursor is opaque.
message IngestRunPage {
  repeated IngestRun items = 1;
  // Pass back to fetch the next page; empty on the last page.
  string next_cursor = 2;
}

// The body of a request for datasets, one dataset per symbol. Mirrors POST /store's body; owner
// is not here because the server stamps it ('operator' for the UI).
message RequestDatasetRequest {
  repeated string symbols = 1;
  trader_joe.proto.market.v1.AssetType asset_type = 2;
  trader_joe.proto.market.v1.DataType data_type = 3;
  trader_joe.proto.market.v1.DataSource source = 4;
  // The caller's tape preference. UNSPECIFIED means the deployment decides.
  trader_joe.proto.market.v1.Feed feed = 5;
  trader_joe.proto.market.v1.Granularity granularity = 6;
  // STATIC: a half-open range [start, end): start included, end excluded, end after start.
  // DAILY: a subscription from start; end is unset.
  google.protobuf.Timestamp start = 7;
  google.protobuf.Timestamp end = 8;
  trader_joe.proto.market.v1.UpdateType update_type = 9;
  ExpiryType expiry_type = 10;
  // Unset means the dataset never expires.
  google.protobuf.Timestamp expiry = 11;
  // Carried and inert in PR 4: stored with the request, never acted on.
  google.protobuf.Timestamp ready_by = 12;
  bool best_effort = 13;
}

// Why one symbol of a request was not accepted.
message RequestDatasetError {
  string reason = 1;
  string message = 2;
}

// The outcome for one symbol: request_id is set (accepted and enqueued), or error is. There is no
// refusal outcome in PR 4.
message RequestDatasetResult {
  string symbol = 1;
  // The request-log entry's id, as text.
  string request_id = 2;
  // EMPTY until the fetch's acknowledgement, except for a repeat of an existing dataset, which
  // answers with that dataset's id at once.
  string dataset_id = 3;
  RequestDatasetError error = 4;
}

message RequestDatasetResponse {
  repeated RequestDatasetResult results = 1;
}

// The informational estimate for a request, before it is made. It never refuses and never
// predicts a shortfall.
message RequestEstimateRequest {
  repeated string symbols = 1;
  trader_joe.proto.market.v1.AssetType asset_type = 2;
  trader_joe.proto.market.v1.DataType data_type = 3;
  trader_joe.proto.market.v1.DataSource source = 4;
  trader_joe.proto.market.v1.Feed feed = 5;
  trader_joe.proto.market.v1.Granularity granularity = 6;
  // Half-open [start, end): start included, end excluded. end unset means up to now.
  google.protobuf.Timestamp start = 7;
  google.protobuf.Timestamp end = 8;
  trader_joe.proto.market.v1.UpdateType update_type = 9;
}

message RequestEstimateResponse {
  // The bars the request is expected to return, over all symbols.
  int64 estimated_bars = 1;
  // The vendor calls the request is expected to cost, over all symbols.
  int64 estimated_vendor_calls = 2;
  // The quota scope the calls would be charged to: a non-secret configured label.
  string quota_key = 3;
  // The share of the scope's current window the calls would use, 0 to 100 (may exceed 100).
  double percent_of_window = 4;
}

// PHASE 3 (tj-grna9p.84): usage by reader, and the expiry and delete writes. Additive to everything
// above.

// What kind of client a read came from. The server derives it from the reader's client id:
// UI iff the id is 'operator', everything else (and anything unattributed) is SDK. UNSPECIFIED is a
// proto3 zero value only and is never stored, filtered on or returned as a figure's kind.
enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  CLIENT_KIND_UI = 1;
  CLIENT_KIND_SDK = 2;
}

// CLIENT FILTER, shared by the dataset list, the facets and the usage-stats routes. These are query
// parameters, not message fields:
//   client_id   repeatable, exact match on the reader's client id.
//   client_kind repeatable, a ClientKind member name with or without the CLIENT_KIND_ prefix, any
//               case, per the existing enum-filter rule.
// client_id wins over client_kind when both are sent. With neither, the kind is SDK. Responses echo
// what was applied in client_ids and client_kinds.
//
// ECHO RULE, at every echo site (this file and stats.proto): exactly ONE of client_ids and
// client_kinds is non-empty. If client_id was sent, client_ids holds the ids applied and
// client_kinds is EMPTY. Otherwise client_ids is EMPTY and client_kinds holds the kinds applied,
// which is [CLIENT_KIND_SDK] by default (written out, never left empty).
//
// client_id is the reader's OWNER string: a free-text LABEL, never a credential and never used to
// authorise anything. A reader declares it in the X-Client-Id request header (not in these messages
// and never on a write route); it is unauthenticated, so a filter by it is bookkeeping. The reserved
// values '_unattributed' (header missing, empty or malformed) and '_overflow' (past the per-dataset,
// per-day cap of distinct ids) are SDK and can appear wherever a client_id does.

// How a dataset has been read.
message DatasetUsage {
  // The latest read by the selected clients. Unset means never read by them.
  google.protobuf.Timestamp last_read_at = 1;
  // Reads in the last 30 days by the selected clients.
  int64 reads_30d = 2;
  // The kinds that read it in the last 30 days, regardless of the filter, so the UI can say 'UI
  // only'.
  repeated ClientKind read_by_30d = 3;
  // The client ids that read it in the last 30 days, regardless of the filter. Free-text labels.
  repeated string read_by_clients_30d = 4;
  // Echo of the filter the figures cover, per the ECHO RULE above: client_ids is the ids applied,
  // empty when the kind filter applied.
  repeated string client_ids = 5;
  // Per the ECHO RULE: the kinds applied (SDK by default), EMPTY when client_id was sent.
  repeated ClientKind client_kinds = 6;
}

// The list's usage query filter, over the clients selected by the CLIENT FILTER.
enum UsageFilter {
  USAGE_FILTER_UNSPECIFIED = 0;
  // Read by the selected clients in the last 30 days.
  USAGE_FILTER_READ_30D = 1;
  // No read by them in the last stale_days, never-read INCLUDED.
  USAGE_FILTER_STALE = 2;
  // Never read by them.
  USAGE_FILTER_NEVER_READ = 3;
}

// One page of the datasets the reaper would delete: GET /ui/v1/reaper/pending (tj-grna9p.23). Keyset
// paging over (expiry, id); the cursor is opaque.
message ReaperPendingPage {
  // Each item carries expiry, bar_count, owner, and reaper_pending = true.
  repeated DatasetSummary items = 1;
  // Pass back to fetch the next page; empty on the last page.
  string next_cursor = 2;
  // False means dry-run: the datasets are listed, nothing is deleted.
  bool deletes_enabled = 3;
  // The server time the pending set was computed at.
  google.protobuf.Timestamp as_of = 4;
}

// One client seen reading, for the picker.
message ClientCount {
  // The reader's owner string: a free-text label, never a credential.
  string client_id = 1;
  ClientKind client_kind = 2;
  // Datasets this client read in the last 30 days.
  int64 datasets = 3;
}

// The operator's acknowledgement when acting on a dataset another owner holds. Required by the
// route when the dataset's owner is not 'operator' (tj-grna9p.6); the server appends it to the
// operator override log.
message OperatorOverride {
  // Why the operator is acting on a dataset another owner holds. Free text, not empty.
  string reason = 1;
  // The operator confirmed the override. The route refuses when false.
  bool confirmed = 2;
}

// The body of the expiry write for one dataset.
message SetExpiryRequest {
  // The new expiry time, which is the deletion date and nothing else. Unset clears the deletion date
  // only and resumes nothing: whether the dataset is collecting is the collect intent, set by
  // SetCollectingRequest. Presence is meaningful, hence optional.
  optional google.protobuf.Timestamp expiry = 1;
  // Required when the dataset's owner is not 'operator'.
  OperatorOverride override = 2;
}

// The body of the collect write for one dataset. DAILY and STREAM subscriptions only; a STATIC
// dataset has no collect intent and the route refuses it.
message SetCollectingRequest {
  // The operator's intent: true schedules the subscription, false stops it (RETIRED). Stopping does
  // not delete anything or touch the expiry. Required in practice: presence is meaningful, hence
  // optional, and an absent value means 'refuse' (the route returns 422), never 'stop'. An empty or
  // forgotten body must not read as collect=false.
  optional bool collect = 1;
  // Required when the dataset's owner is not 'operator'.
  OperatorOverride override = 2;
}

// The body of a dataset delete.
message DeleteDatasetRequest {
  // Required when the dataset's owner is not 'operator'.
  OperatorOverride override = 1;
}
