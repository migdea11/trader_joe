// THE data_store -> data_ingest CONTRACT (tj-3mk3u5.27; ADR tj-8konfu addendum A1 item 2; tj-7zjov1.13).
// Three calls, all data_store -> data_ingest:
//   Submit        unary. Hands ingest one request of any kind (bars, asset list, corporate actions) and is
//                 answered AT ONCE: for bars, accepted with the resolved feed or refused for its feed;
//                 for asset list and corporate actions, accepted with FEED_UNSPECIFIED (no tape), never
//                 refused in the ack. The data
//                 does not come back on this call; ingest pushes each attempt's result to the store
//                 (tj-26jt9w, 2026-10-24 rulings; the store's side of that is store.proto).
//   Instance      unary. Which ingest process is answering, and when it started (the restart marker).
//   Quote         unary. What a fetch would cost, without making it.
// The PR 4 result-bearing stream, FetchDataset, is gone (P37, tj-7zjov1): nothing called it once Submit
// and the result path replaced it.
//
// INTERNAL means both ends always deploy together: data_store and data_ingest ship from this
// repository in one release. Nothing outside it calls this, buf's breaking checks ignore
// trader_joe.proto.internal (tj-3mk3u5.42 R3), and the shape may change freely. The external,
// strategy-facing contract is a different package and is NOT this (tj-3mk3u5.21, tj-3mk3u5.22 Q3).
//
// WHY A REFUSED FEED IS ANSWERED IN THE ACK AND NEVER BY A STATUS (user ruling, tj-3mk3u5.22 Q5).
// Ingest alone decides which tape it can serve, and the store writes its dataset entry -- feed
// included -- only once it has the ack. So the one thing the ack must settle is the feed, and the one
// refusal carried in-band is an unservable feed, on the Submit ack. Every OTHER failure on this hop is a
// gRPC status with a google.rpc.Status + ErrorInfo, rendered by common/rpc (tj-3mk3u5.37.7), and the
// server never deliberately returns UNAVAILABLE (ADR tj-8konfu D6.4).
syntax = "proto3";

package trader_joe.proto.internal.ingest.v1;

import "google/protobuf/timestamp.proto";
import "trader_joe/proto/market/v1/enums.proto";

// Asks data_ingest for one dataset. A contract may import market/v1; it never imports another
// contract, so the vocabulary below is the shared one and nothing here restates it.
service IngestService {
  // Unary. Submits one request of any kind and answers at once; see SubmitRequest. Idempotent on
  // request_id: a request id ingest already holds is answered again, not queued twice. The wire path is
  // /trader_joe.proto.internal.ingest.v1.IngestService/Submit.
  rpc Submit(SubmitRequest) returns (SubmitResponse);

  // Unary. The restart marker: the id this ingest process minted at start and when it started. The
  // store probes it to notice a restart nobody announced. The wire path is
  // /trader_joe.proto.internal.ingest.v1.IngestService/Instance.
  rpc Instance(InstanceRequest) returns (InstanceResponse);

  // Unary. What one fetch would cost and what capacity is left, without making it (tj-grna9p.44).
  // INFORMATIONAL: data_store uses the answer for the estimate card, the request's stored snapshot
  // and the quota cap, and never to refuse a request. The wire path is
  // /trader_joe.proto.internal.ingest.v1.IngestService/Quote.
  rpc Quote(QuoteRequest) returns (QuoteResponse);
}

// WHAT INGEST ACTUALLY READS, and deliberately nothing more. Established by reading data/ingest
// rather than by copying GetDatasetRequest: expiry and expiry_type are retention policy that no
// reader touches, and dataset_id is a data_store row id that must not cross the wire (tj-8konfu
// D7.2, tj-rh4b7f).
message FetchDatasetRequest {
  // The principal the fetch acts for. Carried, not yet read: nothing under data/ingest/app reads it
  // today (the Kafka schema says the same of its own owner field), but it is identity on the store's
  // entry and may not be invented downstream, so the hop that will need it carries it from the start.
  string owner = 1;

  // Which reader serves this: data/ingest/app/ingest_control.py dispatches on it.
  trader_joe.proto.market.v1.DataSource source = 2;

  // The instrument. The reader uppercases nothing here; the store's schema already normalised it.
  string asset_symbol = 3;

  // Dispatch only -- the stock path hard-codes AssetType.STOCK onto the instrument it builds -- but
  // it is what selects that path, so an unsupported type is refused rather than silently read as one.
  trader_joe.proto.market.v1.AssetType asset_type = 4;

  // At least one. An empty list is a refusal, not an empty fetch.
  repeated trader_joe.proto.market.v1.DataType data_types = 5;

  trader_joe.proto.market.v1.Granularity granularity = 6;

  // The window asked for. start is required and inclusive.
  google.protobuf.Timestamp start = 7;

  // UNSET MEANS AN OPEN END, "up to whatever is current", which the reader serves as its as_of. A
  // message field has explicit presence in proto3, so unset and "the epoch" are distinguishable here
  // without an extra flag.
  google.protobuf.Timestamp end = 8;

  // Becomes the rate budget's priority: STREAM -> LIVE, STATIC -> BACKFILL, anything else ->
  // INTERACTIVE (data/ingest/app/brokers/rate_budget.py).
  trader_joe.proto.market.v1.UpdateType update_type = 9;

  // OPTIONAL, and the only field whose zero value is meaningful. FEED_UNSPECIFIED means "the
  // deployment decides"; any other value means "this tape, or refuse the fetch in the ack". It is
  // never a selection -- ingest resolves the tape it is entitled to and can only check a named feed
  // against it (tj-3mk3u5.22 Q5). There is deliberately no `optional` keyword: with one, "unset" and
  // "set to FEED_UNSPECIFIED" would be two spellings of the same request.
  trader_joe.proto.market.v1.Feed feed = 10;

  // The store's request-log handle for this fetch, so the vendor calls ingest makes can be tied back
  // to the request that caused them (decision tj-grna9p.9 item 6). Empty when the fetch has no
  // request-log entry (a scheduled pass). It is NOT a correlation key on the result path.
  string request_id = 11;

  // When the requester wants the data by. Unset means no deadline and the request never expires (owner
  // ruling O3, tj-26jt9w 2026-10-24). On this request it is carried and unused; the queue and the expiry
  // at dequeue are on Submit, where SubmitRequest.ready_by states them.
  google.protobuf.Timestamp ready_by = 12;

  // The requester accepts a partial or late answer. Carried and unused, like ready_by.
  bool best_effort = 13;
}

// ONE REQUEST, OF ANY KIND. The envelope is what every kind shares; the kind itself is the oneof.
// Every kind rides the one queue and the one gate, which is why they are request kinds and not three
// RPCs. Vendor-neutral throughout: a field is named for what it means, never for one vendor's wording,
// and vendor payloads are carried raw by the result path and not restated here.
message SubmitRequest {
  // The store's durable handle for this request, written before it is sent. REQUIRED and the
  // idempotency key: Submit with an id ingest already holds is answered again and queued once.
  string request_id = 1;

  // The principal the request acts for. Carried, not yet read, like FetchDatasetRequest.owner.
  string owner = 2;

  // RESERVED. A short label for the client that asked, so a later scheduler can account per client.
  // Carried and unused; ingest does not read it and nothing may branch on it.
  string client = 3;

  // WHEN THE REQUESTER WANTS THE DATA BY, and present on every request. UNSET MEANS NO DEADLINE AND THE
  // REQUEST NEVER EXPIRES (owner ruling O3, 2026-10-24): it runs when there is slack and sorts after
  // every request that has a ready_by. SET: a request taken off the queue after this instant has passed
  // is FAILED with cause expired and is never sent to the vendor (owner ruling on R4, 2026-10-24); the
  // check is made at dequeue, so a request that is already being attempted is not cut short. A message
  // field has explicit presence in proto3, so unset and "the epoch" are distinguishable.
  google.protobuf.Timestamp ready_by = 4;

  // The requester accepts a partial or late answer. Carried and unused.
  bool best_effort = 5;

  // TRUE when the store is re-submitting a request that an earlier ingest instance held and whose
  // result never arrived (restart ruling, tj-26jt9w addendum 5). Such a request was NOT DELIVERED: the
  // lost attempt is not counted, is not a broker failure and is not shown as failed. Ingest charges the
  // request's registered cost estimate to its current rate window before scheduling it, so a fresh
  // instance starts with the right count.
  bool recovered = 6;

  // The attempts the store has already counted for this request (the durable count). Zero on a first
  // submission. Ingest numbers its next attempt attempt_count + 1, so a restart never resets the
  // attempt budget. Meaningful whether or not recovered is set.
  uint32 attempt_count = 7;

  oneof kind {
    BarsRequest bars = 10;
    AssetListRequest asset_list = 11;
    CorporateActionsRequest corporate_actions = 12;
  }
}

// Bars for one instrument: what FetchDatasetRequest asked for, minus the envelope fields above.
message BarsRequest {
  trader_joe.proto.market.v1.DataSource source = 1;
  string asset_symbol = 2;
  trader_joe.proto.market.v1.AssetType asset_type = 3;

  // At least one. An empty list is a refusal, not an empty fetch.
  repeated trader_joe.proto.market.v1.DataType data_types = 4;
  trader_joe.proto.market.v1.Granularity granularity = 5;

  // Inclusive and required.
  google.protobuf.Timestamp start = 6;

  // Unset means an open end, as on FetchDatasetRequest.
  google.protobuf.Timestamp end = 7;
  trader_joe.proto.market.v1.UpdateType update_type = 8;

  // FEED_UNSPECIFIED means the deployment decides; see FetchDatasetRequest.feed.
  trader_joe.proto.market.v1.Feed feed = 9;
}

// The vendor's asset list for one source, as it stands now. The one non-reproducible past state on this
// hop, so its result is written by the store before it is acknowledged.
message AssetListRequest {
  trader_joe.proto.market.v1.DataSource source = 1;
  trader_joe.proto.market.v1.AssetType asset_type = 2;

  // WHICH LIST the request wants, and REQUIRED: the zero value is refused by the mapper, the same
  // explicit-value rule as the feed, so a request always names one list. The inactive list is large and
  // is pulled on a slower cadence than the active one (tj-26jt9w addendum 7). An older sender that
  // knows no such field sends the zero and is refused rather than guessed at.
  AssetListStatus status = 3;
}

// Which of the vendor's two asset lists an AssetListRequest asks for.
enum AssetListStatus {
  ASSET_LIST_STATUS_UNSPECIFIED = 0;
  ASSET_LIST_STATUS_ACTIVE = 1;
  ASSET_LIST_STATUS_INACTIVE = 2;
}

// Corporate actions for one instrument over an EXPLICIT window. The default window (90 days each side
// of today) is the store's to compute; ingest never defaults it, so both ends are required here.
message CorporateActionsRequest {
  trader_joe.proto.market.v1.DataSource source = 1;
  string asset_symbol = 2;

  // Inclusive and required.
  google.protobuf.Timestamp start = 3;

  // Exclusive and required.
  google.protobuf.Timestamp end = 4;
}

// Answers a Submit at once; nothing in it is data. The ack is the old FetchAck, unchanged, so the same
// two outcomes mean the same things: accepted carries the resolved feed for bars and FEED_UNSPECIFIED
// for asset_list and corporate_actions, plus the quota key. Refused (an unservable feed) arises only
// for bars; the other two kinds are refused only by a gRPC status, if at all. Every other failure is a
// gRPC status too. The vendor asset id is not here: it rides the result path's delivery header.
message SubmitResponse {
  FetchAck ack = 1;

  // The id of the ingest process that answered, on accepted and refused alike. The store learns of a
  // restart from an id it has not seen (tj-26jt9w addendum 5).
  string instance_id = 2;
}

message InstanceRequest {}

message InstanceResponse {
  // Minted once, when the process starts. A different id is a different process.
  string instance_id = 1;
  google.protobuf.Timestamp started_at = 2;
}

// The Submit ack. Either the request is viable and the resolved feed is settled, or it is refused for
// its feed. Nothing else is answered here: a request that is not viable for any other reason ends with
// a gRPC status instead of an ack.
message FetchAck {
  oneof outcome {
    FetchAccepted accepted = 1;
    FetchRefused refused = 2;
  }
}

// The fetch is viable. The store writes its dataset entry, feed included, on this.
message FetchAccepted {
  // THE RESOLVED FEED: the tape this deployment is entitled to, decided once per fetch and the one
  // value only ingest may decide. Never FEED_UNSPECIFIED for bars -- a feed nobody resolved is an
  // error, not a value (tj-vhboky.1), so the mapper refuses the zero for bars only. That covers
  // a Submit of kind bars. A Submit of kind asset_list or corporate_actions has no
  // tape, so its accepted ack always carries FEED_UNSPECIFIED, and the mapper accepts the zero there.
  trader_joe.proto.market.v1.Feed feed = 1;

  // The quota scope this fetch is charged to. A NON-SECRET CONFIGURED LABEL: never key material and
  // never a hash of it. It arrives in the ack so the store can record it before the result does.
  // The request's ownership key is a separate field and is not this.
  string quota_key = 2;
}

// The fetch is refused, and this is the ack's only content. In ADR tj-fa1rpu's terms it is a REFUSED
// outcome: permanent for the request as asked, so it carries no reset_at and no retry hint -- no wait
// cures it. The fields MIRROR google.rpc.ErrorInfo so that the client seam (tj-3mk3u5.28) builds the
// same domain error a REFUSED status would have produced, and data_store's HTTP edge then renders it
// as problem+json like any other. Mirroring rather than importing is deliberate: google/rpc/*.proto
// would need its own include root and the googleapis-common-protos package, and this is the only
// in-band refusal on the hop.
message FetchRefused {
  // A value of the closed Reason vocabulary in common/errors, which is canonical in PYTHON and not
  // here (ADR tj-fa1rpu U1; the one named exception to tj-8konfu D1). Today it is only
  // FEED_NOT_AVAILABLE. A STRING and not an enum on purpose: a client must survive a reason it has
  // never heard of, and the seam turns an unrecognised one into PEER_PROTOCOL_ERROR rather than
  // failing to decode the message.
  string reason = 1;

  // The vocabulary the reason belongs to: ERROR_DOMAIN, "trader-joe". (domain, reason) is the
  // error's identity.
  string domain = 2;

  // For a human, and never parsed. It carries no secret, no vendor body and no stack trace.
  string detail = 3;

  // Allowlisted context, keys from common/errors METADATA_KEYS -- for this reason, the feed asked
  // for. map<string, string> exactly as ErrorInfo declares it; the mapper formats a value that is a
  // sequence on the Python side, so both transports write the same text.
  map<string, string> metadata = 4;
}

// One fetch to be quoted. The store sums the quotes of a multi-symbol request.
message QuoteRequest {
  FetchDatasetRequest fetch = 1;
}

message QuoteResponse {
  // The vendor calls the fetch would make (paging and batching are broker-specific).
  uint64 estimated_vendor_calls = 1;
  // The scope ingest would charge now: a non-secret configured label, never key material.
  string quota_key = 2;
  // Every scope in the pool, with its capacity now.
  repeated ScopeCapacity scopes = 3;
}

message ScopeCapacity {
  // A non-secret configured label.
  string quota_key = 1;
  // Calls allowed per window. Zero when the scope declares no cap.
  uint64 cap = 2;
  uint64 remaining = 3;
  uint64 window_seconds = 4;
  google.protobuf.Timestamp reset_at = 5;
}
