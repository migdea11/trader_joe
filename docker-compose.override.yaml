# pgAdmin is not here: it lives in docker-compose.tools.yaml, which only `make dev-tools` and
# `make dev-down` load, so the dev stack needs no PGADMIN_* values (tj-ae3n49).
#
# This file is also the one place the latency harness is switched on. .env.default ships
# LATENCY_TEST_ENABLED=false because every environment is copied from it and the harness costs
# startup work in both services even when nobody calls GET /latency -- each creates the latency
# Kafka topics and its RPC consumer. Only the dev stack loads this override (PROD_COMPOSE never
# does), so enabling it here keeps `make dev-launch` able to run the REST vs Kafka RPC comparison
# that tj-3mk3u5.8 needs. Both services must carry it: data_store is the client and data_ingest
# the server, and a client with no server just times out.
#
# DEV REACH (decision record tj-q9ae5u, addendum 1, item 3'). This file also puts every stack
# service on devnet, one external network that the devcontainer and pgAdmin join too, so a dev
# session reaches the whole stack by service name. Each service below lists devnet ONLY: compose
# merges a service's networks from this file and the base file by key, so each keeps its prod
# networks and gains devnet. Restating the prod networks here would only invite drift. There are
# no override tags (!reset, !override) on purpose: the CI invariant tests parse this file as plain
# YAML, and nothing here needs removing -- it only adds.
#
# The loopback publishes (psql, /docs, curl from this machine) live here, not in the base file,
# because prod publishes nothing. They work in dev only because devnet is an ordinary network:
# a container on internal networks alone has no gateway to publish through.
services:
  postgres:
    networks:
      - devnet
    ports:
      # Loopback only: a published port bypasses the host firewall entirely, so the bare
      # "5432:5432" would put this database on every interface the machine has. Solely for
      # psql or a GUI client on this machine.
      - "127.0.0.1:${DATABASE_PORT}:5432"

  kafka:
    # devnet only, and still no published port (see the base file's kafka comment).
    networks:
      - devnet

  data_store:
    networks:
      - devnet
    ports:
      # Loopback only: /docs and curl from this machine, and from nowhere else.
      - "127.0.0.1:${DATA_STORE_PORT}:${APP_INTERNAL_PORT}"
    build:
      target: dev_image
    read_only: true
    volumes:
      - ./data/store/app:/code/data/store/app
      - ./common:/code/common
      # Beside ./common always: the generated code common/rpc imports (the image's PYTHONPATH
      # names /code/gen/proto/python), so a `make proto` on the host reaches the container too.
      - ./gen/proto/python:/code/gen/proto/python
      - ./routers:/code/routers
      - ./schemas:/code/schemas
    environment:
      - LOG_LEVEL=debug
      # Latency harness client: serves GET /latency (see the header comment).
      - LATENCY_TEST_ENABLED=true
    image: trader_joe_data_store:dev

  data_ingest:
    networks:
      - devnet
    ports:
      # Loopback only, same reasoning as data_store: unauthenticated API.
      - "127.0.0.1:${DATA_INGEST_PORT}:${APP_INTERNAL_PORT}"
    build:
      target: dev_image
    volumes:
      - ./data/ingest/app:/code/data/ingest/app
      - ./common:/code/common
      # Beside ./common, as on data_store.
      - ./gen/proto/python:/code/gen/proto/python
      - ./routers:/code/routers
      - ./schemas:/code/schemas
    environment:
      - LOG_LEVEL=debug
      # Latency harness server: answers data_store over REST and Kafka RPC. Must match the
      # data_store setting above -- enabling one alone leaves a client with no server.
      - LATENCY_TEST_ENABLED=true
    image: trader_joe_data_ingest:dev

# devnet: an ordinary bridge (NOT internal), owned by neither compose project and so declared
# external here. `make dev-network` creates it idempotently as a prerequisite of dev-deps,
# dev-tools and agent-up, and the devcontainer's initializeCommand creates it too, so whichever
# starts first works; no down, prune or clean ever removes it. Its fixed name
# trader_joe_devnet appears in exactly four places, which must agree: this file, the Makefile's
# DEV_NETWORK variable, .devcontainer/compose.yml and the initializeCommand in
# .devcontainer/devcontainer.json.
networks:
  devnet:
    external: true
    name: trader_joe_devnet