# THE AGENT STACK OVERLAY (ADR tj-4rr0la section 1, addenda 1-2; tj-c4mosr.2, .7). The agent stack
# is a second, isolated copy of the stack that the agent-stack MCP (tools/agent_mcp) builds from an
# agent's worktree and drives through its fixed verbs, so agents can run the system suite without a
# Docker socket. It runs beside the user's dev or prod stack on the same host and must never collide
# with either or attach to either. This file holds ONLY what makes it separate; everything else is
# the base file.
#
# Loaded ONLY by the agent-stack MCP, as the Makefile's AGENT_STACK_COMPOSE spells it -- under the
# compose project trader_joe_agent_stack, never the default project that prod-launch and the dev
# targets use -- and ONLY with the file list there: docker-compose.yaml, then
# docker-compose.test-client.yaml, then this file, so what it sets wins over both, and only the
# fake-mode overlay docker-compose.fake.yaml after it (tj-vhboky.61), which touches nothing this file
# sets. PROD_COMPOSE,
# DEV_COMPOSE, TOOLS_COMPOSE and TEST_CLIENT_COMPOSE never load it, and it is never loaded beside
# docker-compose.override.yaml or docker-compose.tools.yaml: so NO devnet and NO published port.
# The base file publishes nothing and this file adds nothing.
#
# THE VALUES COME FROM THE AGENT STACK'S OWN ENV FILE, generated by the MCP server at first use and
# kept OUTSIDE the repository beside the agent stack's data (default
# ${XDG_DATA_HOME:-$HOME/.local/share}/trader_joe_agent_stack/), never the user's .env. Every value
# this file reads carries a ":?" guard and NO default: a fallback here could only be one of the
# user's own names -- trader_joe_store_api, ./volume_data -- which is exactly the collision this file
# exists to prevent. STORE_API_NETWORK doubles as the sentinel: no user .env sets it, so a run that
# fell back to the checkout's .env for interpolation stops at this file rather than starting a stack
# on the user's names. The generated env sets, each distinct from the user's stack:
#   DATABASE_NAME               postgres's container name, and by interpolation the host compose
#                               writes into DATABASE_URI. The app reads the same name from its
#                               CONTAINER environment instead
#                               (server/data/store/app/database/database.py), which env_file supplies.
#                               The two agree only because the root generated file is BOTH the
#                               --env-file and ROOT_ENV_FILE, and neither the store nor the ingest
#                               generated file sets the name.
#   STORE_API_NETWORK           store_api's fixed name, which the base file reads with the prod name
#                               as its default.
#   DATA_DIR                    postgres data, under the agent stack's own directory.
#   ROOT_ENV_FILE, STORE_ENV_FILE, INGEST_ENV_FILE
#                               the absolute paths of the three generated service env files, which
#                               the base file's env_file entries read in place of the checkout's own
#                               (ADR tj-4rr0la addendum 2). The base defaults them to the checkout's
#                               files -- in the root checkout, the user's, with credentials -- and
#                               compose appends env_file on merge, so this file cannot replace them;
#                               the labels below make it refuse to render unless all three are set.
# The other networks need nothing: they carry compose's project prefix, and the project name differs.
#
# THE DAEMON NEVER READS AGENT-CHANGEABLE INPUTS (ADR tj-4rr0la addendum 5). The MCP passes its own
# snapshot of the worktree as --project-directory, so every relative path below and in the base and
# test-client files resolves inside an MCP-owned copy. On top of that:
#   build.dockerfile  every service the agent stack builds uses the MCP image's own copy of the
#                     service Dockerfile (/opt/agent_mcp/compose/Dockerfile, stack.TRUSTED_DOCKERFILE),
#                     never the snapshot's: FROM and COPY --from are then fixed, so a build cannot
#                     read other images on the host daemon. compose merges build keys, so context,
#                     target and args stay from the base and test-client files. The path exists only
#                     inside the MCP image. Its external refs are digest-pinned and pulled by the
#                     daemon before every build (stack.BASE_IMAGES), because buildx would otherwise
#                     fetch the registry token from inside agent_mcp, which has no egress (ADR
#                     tj-4rr0la addendum 13).
#   read-only binds   no service built from agent source gets a writable bind mount (data_store's
#                     are restated :ro below); the only writable bind is postgres's DATA_DIR one.
services:
  postgres:
    container_name: ${DATABASE_NAME:?the agent stack env sets DATABASE_NAME; there is no default}
    # The env-file guard (addendum 2). A label per env file the service loads, because a label is
    # the one carrier that is interpolated like any value yet does nothing at run time: not
    # environment: (the container would gain it), not a restated env_file: (compose appends, so the
    # base entries would still load), and plain YAML, not !override. It also leaves docker inspect
    # naming the env files each container started with.
    labels:
      trader_joe.agent_stack.root_env_file: ${ROOT_ENV_FILE:?the agent stack env sets ROOT_ENV_FILE; there is no default}
      trader_joe.agent_stack.store_env_file: ${STORE_ENV_FILE:?the agent stack env sets STORE_ENV_FILE; there is no default}
    volumes:
      # Same container target as the base file's entry, so compose replaces that entry rather than
      # adding a second mount: the agent stack never touches ./volume_data or the user's DATA_DIR.
      - ${DATA_DIR:?the agent stack env sets DATA_DIR; there is no default}/postgres:/var/lib/postgresql/data

  # Image tags are host-global, like container names. Without these the agent stack's build from an
  # arbitrary worktree would retag trader_joe_data_store:latest and trader_joe_data_ingest:latest --
  # the images the user's own prod-launch starts.
  data_store:
    image: trader_joe_agent_stack_data_store:latest
    build:
      dockerfile: /opt/agent_mcp/compose/Dockerfile
    labels:
      trader_joe.agent_stack.root_env_file: ${ROOT_ENV_FILE:?the agent stack env sets ROOT_ENV_FILE; there is no default}
      trader_joe.agent_stack.store_env_file: ${STORE_ENV_FILE:?the agent stack env sets STORE_ENV_FILE; there is no default}
    volumes:
      # The base file's two binds, restated READ-ONLY with the SAME container targets
      # (docker-compose.yaml's data_store volumes), so compose replaces them rather than adding a
      # second mount. The agent's code runs in this container, and once chose its USER: a writable
      # bind would let it write into the snapshot the MCP later removes, as whatever user it picked.
      # Host side only (epic tj-iontkq, R-2): /code is unchanged, the checkout gained ./server.
      - ./server/data/store/alembic.ini:/code/alembic.ini:ro
      - ./server/data/store/migrations:/code/migrations:ro

  data_ingest:
    image: trader_joe_agent_stack_data_ingest:latest
    build:
      dockerfile: /opt/agent_mcp/compose/Dockerfile
    labels:
      trader_joe.agent_stack.root_env_file: ${ROOT_ENV_FILE:?the agent stack env sets ROOT_ENV_FILE; there is no default}
      trader_joe.agent_stack.ingest_env_file: ${INGEST_ENV_FILE:?the agent stack env sets INGEST_ENV_FILE; there is no default}

  test_client:
    image: trader_joe_agent_stack_test_client
    build:
      dockerfile: /opt/agent_mcp/compose/Dockerfile

networks:
  store_api:
    name: ${STORE_API_NETWORK:?the agent stack env sets STORE_API_NETWORK; there is no default}
  # data_ingest off the egress network. compose merges a service's networks by key, so no plain-YAML
  # overlay can take ingest_egress off data_ingest; this makes the network itself internal instead,
  # which leaves data_ingest -- its only member -- with no gateway. The agent stack holds no broker
  # credentials, so egress would buy it nothing. No !reset or !override tag: the invariant tests
  # parse every compose file as plain YAML.
  ingest_egress:
    internal: true
