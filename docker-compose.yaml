services:
  postgres:
    # Pinned to an exact patch AND base OS: PGDATA is a bind mount, so a silent base-OS
    # bump would change glibc and with it the collation version of every text index.
    # 13 went EOL 2025-11-13; bump deliberately (tj-owduw0).
    image: postgres:17.11-trixie
    container_name: ${DATABASE_NAME}
    networks:
      # store_db only: data_store is the one service that talks to the database, and an
      # internal network gives Postgres no gateway, so no egress and nothing to publish
      # through. No host port in prod -- a published port bypasses the host firewall
      # entirely (docker writes its own DOCKER chain ahead of ufw/firewalld). The dev-only
      # loopback publish for psql lives in docker-compose.override.yaml, with devnet.
      - store_db
    # Every service's env files read ROOT_ENV_FILE, STORE_ENV_FILE and INGEST_ENV_FILE, defaulting
    # to the paths they always had, so the isolated agent stack (docker-compose.agent-stack.yaml,
    # ADR tj-4rr0la addendum 2) can point its services at its own generated, credential-free files
    # outside the repository instead of the user's. Nothing but the agent stack's generated env sets
    # them: unset, as in every .env, this renders exactly as before. Short form on purpose -- a
    # missing env file still stops compose.
    env_file:
      - ${ROOT_ENV_FILE:-.env}
      - ${STORE_ENV_FILE:-./data/store/.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      # No default, by design: a fallback here is a password an attacker already knows.
      # ":?" makes compose refuse to start -- unset and empty both count -- rather than
      # silently standing up a database anyone on the network can log into.
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?set POSTGRES_PASS in .env; there is no default}
    volumes:
      - ${DATA_DIR:-./volume_data}/postgres:/var/lib/postgresql/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # -h 127.0.0.1 on purpose. The postgres entrypoint runs a temporary server during
      # initdb that listens on the unix socket ONLY, so a socket-based pg_isready reports
      # ready while the database is still initialising and every TCP client is refused --
      # exactly the false green this task exists to remove. $$ is compose's escape for a
      # literal $, so the shell inside the container expands these, not the compose file.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    # Confluent Platform 7.9.x == Apache Kafka 3.9.x. Held on the 3.x line on purpose:
    # Kafka 4.0 removed the old protocol api versions (KIP-896) that kafka-python-ng
    # still sends, so moving to cp-kafka 8.x needs the client swap first (tj-q65ux6).
    image: confluentinc/cp-kafka:7.9.10
    container_name: ${BROKER_NAME}
    # No published port, and nothing is lost by that. KAFKA_ADVERTISED_LISTENERS below
    # hands every client back BROKER://${BROKER_NAME}:9092, a name that resolves only on
    # the compose network, so a host client reaching in through a published port was
    # redirected to an address it could not connect to. The mapping bought nothing and
    # put an unauthenticated, plaintext broker on the LAN. Inspect the broker with
    # `docker compose exec kafka`. BROKER_PORT is still the port the services connect to
    # inside the network.
    networks:
      # ingest_store only: its clients are data_store and data_ingest. Internal, so the
      # unauthenticated plaintext broker has no egress and no host port, in prod or dev.
      # When gRPC replaces Kafka this entry goes and ingest_store stays (see networks:).
      - ingest_store
    env_file:
      - ${ROOT_ENV_FILE:-.env}
      - ${INGEST_ENV_FILE:-./data/ingest/.env}
    environment:
      CLUSTER_ID: ${KAFKA_ID}
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,CONTROLLER://${BROKER_NAME}:9093
      KAFKA_ADVERTISED_LISTENERS: BROKER://${BROKER_NAME}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_PROCESS_ROLES: 'controller,broker'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@${BROKER_NAME}:9093'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # Optional: Enable dynamic topic creation
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ${DATA_DIR:-./volume_data}/kafka:/var/lib/kafka/
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # The broker's own admin client against the BROKER listener: this succeeds only once
      # the KRaft broker has finished startup and is answering the protocol, which a TCP
      # connect test does not distinguish from a socket that is merely bound. localhost is
      # deliberate -- KAFKA_LISTENERS binds 0.0.0.0:9092, and bootstrapping over the loopback
      # keeps the probe independent of how ${BROKER_NAME} resolves.
      #
      # Each probe starts a JVM, hence the 20s timeout: a 5s timeout would report a healthy
      # broker as unhealthy roughly as often as it reported anything. start_period is 90s
      # because KRaft format-and-start takes tens of seconds on a cold volume, and a
      # start_period shorter than the real startup is how `up --wait` acquires a reputation
      # for spurious failure and gets deleted.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 90s
    # kafka needs to write config/state during startup (e.g. /etc/kafka),
    # keep the service writable. Setting the whole container read_only prevents
    # startup scripts from creating files and causes checks like
    # "/usr/local/bin/dub path /etc/kafka/ writable" to fail.


  data_store:
    build:
      context: .
      target: prod_image
      args:
        SERVICE_PATH: data
        SERVICE_NAME: store
    hostname: ${DATA_STORE_NAME:-data_store}
    networks:
      # Three internal networks and nothing else, so data_store has no gateway: no egress,
      # and it cannot be published, which is what keeps it off the internet for good.
      #   store_db      reaches Postgres.
      #   ingest_store  reaches data_ingest and Kafka, and is reached by data_ingest.
      #   store_api     serves its API to client containers (strategies, SDK, test client).
      # No host port in prod: host-side inspection is `compose exec` or a client container
      # on store_api. The dev-only loopback publish for /docs and curl lives in
      # docker-compose.override.yaml, with devnet.
      - store_db
      - ingest_store
      - store_api
    volumes:
      - ./data/store/alembic.ini:/code/alembic.ini
      - ./data/store/migrations:/code/migrations
    env_file:
      - ${ROOT_ENV_FILE:-.env}
      - ${STORE_ENV_FILE:-./data/store/.env}
    environment:
      # Built from the same variables Postgres itself is given, so there is one password
      # in one place and the app cannot drift from the server. The previous fallback,
      # postgresql://postgres:password@db:5432/postgres, was a working credential pair in
      # a committed file.
      # This is the only definition of DATABASE_URI under compose: data/store/.env.default
      # deliberately leaves it unset (tj-70ovb3), and `environment:` would take precedence
      # over `env_file:` regardless. Its one consumer is data/store/migrations/env.py, which
      # hands it to alembic; the app builds its own DSN from the discrete POSTGRES_* and
      # DATABASE_* variables.
      # The port is the container's 5432, not DATABASE_PORT -- that one is the host-side
      # port of the dev-only loopback publish in docker-compose.override.yaml, and is not
      # what this URI dials.
      - DATABASE_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@${DATABASE_NAME}:5432/${POSTGRES_DB_NAME}
      # The import path, literal: the same entry and the same reasoning as data_ingest's PYTHONPATH
      # below (decision tj-3mk3u5.42 addendum F1-A).
      - PYTHONPATH=/code:/code/gen/proto/python
      # Where data_store dials data_ingest's gRPC server (ADR tj-q9ae5u addendum 5), read by
      # common.rpc.channel.target_from_env, which has NO default and fails startup naming this
      # variable when it is missing. The host is LITERAL: data-ingest-grpc, the alias data_ingest's
      # server binds (APP_INTERNAL_GRPC_HOST below). It is never the hostname, which on devnet can
      # resolve to an address the server never bound. The port is the server's
      # APP_INTERNAL_GRPC_PORT expression byte for byte, so any env file moves both ends together,
      # and :-50051 is the real in-network port. environment: outranks env_file:, so no env file
      # can strand the client.
      - DATA_INGEST_GRPC_TARGET=data-ingest-grpc:${DATA_INGEST_GRPC_PORT:-50051}
    image: trader_joe_data_store:latest
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    healthcheck:
      # There is no curl and no wget in this image. The deploy stage is debian:bookworm-slim
      # plus the venv and nothing apt-installs into it, and uv/uvx are copied into the BUILD
      # stage only -- so a curl-based probe would fail permanently on a healthy service.
      # /code/.venv/bin/python is the interpreter uvicorn itself runs under, so this adds
      # nothing to the image. urlopen raises on a refused connection and on any non-2xx
      # status, so a service that boots and then answers 500 reads as unhealthy. The probe
      # writes nothing, which is what read_only: true above requires.
      #
      # 127.0.0.1 and APP_INTERNAL_PORT: the port inside the container. Prod publishes no
      # port at all; the dev-only loopback publish lives in docker-compose.override.yaml.
      # start_period is 60s because lifespan blocks on database.initialize() and
      # wait_for_kafka() before uvicorn serves a single request.
      test: ["CMD", "/code/.venv/bin/python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_INTERNAL_PORT'] + '/ping', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    depends_on:
      # Long form, not the list. The short form waits for "started", which for Postgres means
      # the container exists, not that it accepts connections -- data_store survived that
      # only because nothing in its boot path talked to the database immediately, and that
      # stopped being true the moment lifespan called database.initialize().
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  data_ingest:
    build:
      context: .
      target: prod_image
      args:
        SERVICE_PATH: data
        SERVICE_NAME: ingest
    hostname: ${DATA_INGEST_NAME:-data_ingest}
    networks:
      #   ingest_store   reaches data_store and Kafka, and is reached by data_store.
      #   ingest_egress  the ordinary bridge that gives it internet access to the broker
      #                  API. data_ingest is the only service on it, and so the only
      #                  component of the stack with egress.
      # No host port in prod: nothing consumes one (data_store reaches it over
      # ingest_store, the healthcheck probes in-container) and its API is unauthenticated.
      # The dev-only loopback publish lives in docker-compose.override.yaml, with devnet.
      #
      # data-ingest-grpc is the name the gRPC server binds (APP_INTERNAL_GRPC_HOST below), an
      # alias on the ingest_store attachment ONLY (ADR tj-q9ae5u addendum 3). Docker's DNS answers
      # a network-scoped alias with this container's address on THAT network, so the listener
      # lands on ingest_store, where data_store reaches it, whatever order the networks attach in.
      # Not the service name or hostname: the container's /etc/hosts maps its hostname to ONE of
      # its addresses, picked by attach order, which nothing here pins -- the server could bind
      # ingest_egress (or devnet in dev) and still start cleanly. Never 0.0.0.0 (tj-r6vcgv
      # addendum 1 A5; tj-glqs4r): common.rpc refuses a wildcard at start. Hyphens, not
      # underscores, so no resolver's tolerance of '_' matters to data_store's client either.
      # CI's System Testing proves the name resolves to the ingest_store address and nothing else.
      ingest_store:
        aliases:
          - data-ingest-grpc
      ingest_egress: {}
    env_file:
      - ${ROOT_ENV_FILE:-.env}
      - ${INGEST_ENV_FILE:-./data/ingest/.env}
    environment:
      # Where the gRPC server listens (common.rpc BindAddress.from_env, which has no default and
      # fails at startup when either is unset). Set here, in the base file, not only in
      # .env.default: every launch loads this file, and environment: outranks env_file:, so no
      # env file can move the listener. The agent stack's env files are generated once and never
      # regenerated, and a user's .env predates these variables, so a value in .env.default
      # alone would reach neither. The :-50051 fallback serves those same older env files; it is
      # the real in-network port, so falling back never puts the listener where the peer cannot
      # reach it. The host is literal: the alias above, never an env-file value.
      APP_INTERNAL_GRPC_HOST: data-ingest-grpc
      APP_INTERNAL_GRPC_PORT: ${DATA_INGEST_GRPC_PORT:-50051}
      # The import path (decision tj-3mk3u5.42 F1 rule 3, addendum F1-A), here for the same reason as
      # the gRPC host above. environment: outranks env_file:, which outranks the image's ENV. The root
      # env file ships a legacy PYTHONPATH=./ (.env.default, host-side only), so without this entry it
      # replaces the Dockerfile's ENV PYTHONPATH in every container. That drops /code/gen/proto/python, the
      # generated code's import root, and common.rpc's first import of trader_joe.proto fails. The value
      # equals the Dockerfile's ENV PYTHONPATH, and a test pins that. LITERAL, never ${...}: compose
      # interpolates from the project directory's env file, which carries that same PYTHONPATH=./, so an
      # interpolated value brings the bug back. Every service built from the Dockerfile's service stages
      # carries this entry (data_store above), and a new one needs it too. CI's System Testing imports
      # common.rpc.ping inside both running services, the one check that sees this precedence at runtime.
      PYTHONPATH: /code:/code/gen/proto/python
    image: trader_joe_data_ingest:latest
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    healthcheck:
      # Same probe and the same reasoning as data_store: no curl in the image, the venv
      # interpreter is already there, and the check writes nothing under read_only: true.
      #
      # TWO HALVES, BOTH MUST PASS (ADR tj-8konfu D6.5; tj-3mk3u5.25). HTTP /ping first, as data_store
      # does, then the standard grpc.health.v1.Health service: Check for service '' must answer
      # SERVING. /ping alone reports healthy a container whose gRPC listener is dead. The server
      # reads NOT_SERVING from the moment it begins to stop, and that fails the check too.
      #
      # The gRPC half dials APP_INTERNAL_GRPC_HOST:APP_INTERNAL_GRPC_PORT read from the CONTAINER
      # environment by os.environ when the check runs (not compose interpolation), i.e. exactly what
      # the server bound, and NEVER 127.0.0.1. The server listens on the data-ingest-grpc alias's
      # ingest_store address only, so a loopback probe always fails, and the "fix" that makes a
      # loopback probe pass is a wildcard bind -- the false green common.rpc's no-default, no-wildcard
      # rule exists to stop. This proves the listener answers on its own interface. It cannot prove
      # data_store reaches it; CI System Testing's Check gRPC Peer Reach step does that.
      #
      # grpcio and grpcio-health-checking are in the base dependency group (common.rpc imports both),
      # so this adds nothing to the image; a grpc_health_probe binary would. The sync grpc API is
      # right for a one-shot probe process: grpc.aio (D2) governs the services' own transport. No
      # wait_for_ready, so a refused connection fails at once with UNAVAILABLE instead of waiting.
      #
      # TIMINGS. timeout 15s: the two 5s call timeouts plus the interpreter's start and the grpc
      # import must fit inside it, so a slow failure reports its own error rather than being killed.
      # start_period stays 60s: the gRPC server starts inside the lifespan, before uvicorn answers
      # /ping, so the second half adds no startup time; the lifespan is otherwise unchanged.
      test:
        - CMD
        - /code/.venv/bin/python
        - -c
        - |
          import os, sys, urllib.request
          import grpc
          from grpc_health.v1 import health_pb2, health_pb2_grpc
          urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_INTERNAL_PORT'] + '/ping', timeout=5).read()
          target = os.environ['APP_INTERNAL_GRPC_HOST'].strip() + ':' + os.environ['APP_INTERNAL_GRPC_PORT'].strip()
          with grpc.insecure_channel(target) as channel:
              reply = health_pb2_grpc.HealthStub(channel).Check(health_pb2.HealthCheckRequest(service=''), timeout=5)
          if reply.status != health_pb2.HealthCheckResponse.SERVING:
              sys.exit(f'gRPC health at {target} reads {health_pb2.HealthCheckResponse.ServingStatus.Name(reply.status)}, not SERVING')
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 60s
    depends_on:
      kafka:
        condition: service_healthy

# THE PROD NETWORK MODEL (decision record tj-q9ae5u, addendum 1). Four named networks, and no
# service on the implicit default network. Three are internal -- no gateway, so nothing on them
# alone has egress or can publish a port -- and one is an ordinary bridge:
#   store_db       internal  postgres, data_store.
#   ingest_store   internal  data_store, data_ingest, and kafka while it exists.
#   store_api      internal  data_store and client containers only (strategies, the SDK, the
#                            system-test client). A client sees data_store and nothing else.
#   ingest_egress  bridge    data_ingest only: the one component with internet access.
# So prod publishes NOTHING on the host, and data_store is never internet-reachable.
#
# Kafka rides ingest_store until gRPC replaces it; removing it then removes no network, because
# ingest_store goes on carrying the data_store <-> data_ingest traffic.
#
# store_api has a fixed name so another compose project (a strategy stack, the private repo's
# clients) can declare it external and join it. The other three keep compose's project prefix.
# The name reads STORE_API_NETWORK, defaulting to trader_joe_store_api, so the isolated agent stack
# (docker-compose.agent-stack.yaml, ADR tj-4rr0la) can run beside this one without joining its
# store_api. Nothing else sets it: unset, as in every .env, this renders exactly as before.
#
# Dev adds one more, devnet, in docker-compose.override.yaml only. PROD_COMPOSE never loads that
# file, so a prod launch never attaches devnet.
networks:
  store_db:
    internal: true
  ingest_store:
    internal: true
  store_api:
    internal: true
    name: ${STORE_API_NETWORK:-trader_joe_store_api}
  ingest_egress: {}
