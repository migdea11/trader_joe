services:
  postgres:
    # Pinned to an exact patch AND base OS: PGDATA is a bind mount, so a silent base-OS
    # bump would change glibc and with it the collation version of every text index.
    # 13 went EOL 2025-11-13; bump deliberately (tj-owduw0).
    image: postgres:17.11-trixie
    container_name: ${DATABASE_NAME}
    ports:
      # Loopback only. A published port bypasses the host firewall entirely -- docker
      # writes its own DOCKER chain ahead of anything ufw/firewalld holds -- so the bare
      # "5432:5432" put this database on every interface the machine has. Nothing in the
      # stack needs it: data_store reaches Postgres over the compose network. This
      # mapping exists solely for psql or a GUI client on this machine.
      - "127.0.0.1:${DATABASE_PORT}:5432"
    env_file:
      - .env
      - ./data/store/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      # No default, by design: a fallback here is a password an attacker already knows.
      # ":?" makes compose refuse to start -- unset and empty both count -- rather than
      # silently standing up a database anyone on the network can log into.
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?set POSTGRES_PASS in .env; there is no default}
    volumes:
      - ${DATA_DIR:-./volume_data}/postgres:/var/lib/postgresql/data
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # -h 127.0.0.1 on purpose. The postgres entrypoint runs a temporary server during
      # initdb that listens on the unix socket ONLY, so a socket-based pg_isready reports
      # ready while the database is still initialising and every TCP client is refused --
      # exactly the false green this task exists to remove. $$ is compose's escape for a
      # literal $, so the shell inside the container expands these, not the compose file.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    # Confluent Platform 7.9.x == Apache Kafka 3.9.x. Held on the 3.x line on purpose:
    # Kafka 4.0 removed the old protocol api versions (KIP-896) that kafka-python-ng
    # still sends, so moving to cp-kafka 8.x needs the client swap first (tj-q65ux6).
    image: confluentinc/cp-kafka:7.9.10
    container_name: ${BROKER_NAME}
    # No published port, and nothing is lost by that. KAFKA_ADVERTISED_LISTENERS below
    # hands every client back BROKER://${BROKER_NAME}:9092, a name that resolves only on
    # the compose network, so a host client reaching in through a published port was
    # redirected to an address it could not connect to. The mapping bought nothing and
    # put an unauthenticated, plaintext broker on the LAN. Inspect the broker with
    # `docker compose exec kafka`. BROKER_PORT is still the port the services connect to
    # inside the network.
    env_file:
      - .env
      - ./data/ingest/.env
    environment:
      CLUSTER_ID: ${KAFKA_ID}
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,CONTROLLER://${BROKER_NAME}:9093
      KAFKA_ADVERTISED_LISTENERS: BROKER://${BROKER_NAME}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT
      KAFKA_PROCESS_ROLES: 'controller,broker'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@${BROKER_NAME}:9093'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # Optional: Enable dynamic topic creation
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ${DATA_DIR:-./volume_data}/kafka:/var/lib/kafka/
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # The broker's own admin client against the BROKER listener: this succeeds only once
      # the KRaft broker has finished startup and is answering the protocol, which a TCP
      # connect test does not distinguish from a socket that is merely bound. localhost is
      # deliberate -- KAFKA_LISTENERS binds 0.0.0.0:9092, and bootstrapping over the loopback
      # keeps the probe independent of how ${BROKER_NAME} resolves.
      #
      # Each probe starts a JVM, hence the 20s timeout: a 5s timeout would report a healthy
      # broker as unhealthy roughly as often as it reported anything. start_period is 90s
      # because KRaft format-and-start takes tens of seconds on a cold volume, and a
      # start_period shorter than the real startup is how `up --wait` acquires a reputation
      # for spurious failure and gets deleted.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 90s
    # kafka needs to write config/state during startup (e.g. /etc/kafka),
    # keep the service writable. Setting the whole container read_only prevents
    # startup scripts from creating files and causes checks like
    # "/usr/local/bin/dub path /etc/kafka/ writable" to fail.


  data_store:
    build:
      context: .
      target: prod_image
      args:
        SERVICE_PATH: data
        SERVICE_NAME: store
    hostname: ${DATA_STORE_NAME:-data_store}
    ports:
      # Loopback only. The API has no authentication of any kind yet, and data_ingest
      # calls it over the compose network on APP_INTERNAL_PORT, not through this
      # mapping. Kept published so /docs and curl still work from this machine; drop the
      # mapping outright once nothing on the host talks to it.
      - "127.0.0.1:${DATA_STORE_PORT}:${APP_INTERNAL_PORT}"
    volumes:
      - ./data/store/alembic.ini:/code/alembic.ini
      - ./data/store/migrations:/code/migrations
    env_file:
      - .env
      - ./data/store/.env
    environment:
      # Built from the same variables Postgres itself is given, so there is one password
      # in one place and the app cannot drift from the server. The previous fallback,
      # postgresql://postgres:password@db:5432/postgres, was a working credential pair in
      # a committed file.
      # This is the only definition of DATABASE_URI under compose: data/store/.env.default
      # deliberately leaves it unset (tj-70ovb3), and `environment:` would take precedence
      # over `env_file:` regardless. Its one consumer is data/store/migrations/env.py, which
      # hands it to alembic; the app builds its own DSN from the discrete POSTGRES_* and
      # DATABASE_* variables.
      # The port is the container's 5432, not DATABASE_PORT -- that one is the host side
      # of the mapping above and is not what this URI dials.
      - DATABASE_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@${DATABASE_NAME}:5432/${POSTGRES_DB_NAME}
    image: trader_joe_data_store:latest
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    healthcheck:
      # There is no curl and no wget in this image. The deploy stage is debian:bookworm-slim
      # plus the venv and nothing apt-installs into it, and uv/uvx are copied into the BUILD
      # stage only -- so a curl-based probe would fail permanently on a healthy service.
      # /code/.venv/bin/python is the interpreter uvicorn itself runs under, so this adds
      # nothing to the image. urlopen raises on a refused connection and on any non-2xx
      # status, so a service that boots and then answers 500 reads as unhealthy. The probe
      # writes nothing, which is what read_only: true above requires.
      #
      # 127.0.0.1 and APP_INTERNAL_PORT: the port inside the container, not the host side of
      # the ports: mapping above. start_period is 60s because lifespan blocks on
      # database.initialize() and wait_for_kafka() before uvicorn serves a single request.
      test: ["CMD", "/code/.venv/bin/python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_INTERNAL_PORT'] + '/ping', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    depends_on:
      # Long form, not the list. The short form waits for "started", which for Postgres means
      # the container exists, not that it accepts connections -- data_store survived that
      # only because nothing in its boot path talked to the database immediately, and that
      # stopped being true the moment lifespan called database.initialize().
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  data_ingest:
    build:
      context: .
      target: prod_image
      args:
        SERVICE_PATH: data
        SERVICE_NAME: ingest
    hostname: ${DATA_INGEST_NAME:-data_ingest}
    ports:
      # Loopback only, same reasoning as data_store: unauthenticated API, and data_store
      # reaches it over the compose network rather than through this mapping.
      - "127.0.0.1:${DATA_INGEST_PORT}:${APP_INTERNAL_PORT}"
    env_file:
      - .env
      - ./data/ingest/.env
    image: trader_joe_data_ingest:latest
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    healthcheck:
      # Same probe and the same reasoning as data_store: no curl in the image, the venv
      # interpreter is already there, and the check writes nothing under read_only: true.
      test: ["CMD", "/code/.venv/bin/python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['APP_INTERNAL_PORT'] + '/ping', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    depends_on:
      kafka:
        condition: service_healthy
