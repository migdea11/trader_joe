[project]
name = "trader-joe"
version = "0.1.0"
description = "FastAPI based algo trading platform"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

# Dependency cooldown: never resolve a release younger than 7 days, so a compromised or
# yanked upload has a window to be caught before it can reach a build here. This closes
# the last semgrep finding from tj-cg2i9p, rule
# package_managers.uv.uv-missing-dependency-cooldown.
#
# THE UV PIN AND THIS KEY MOVE TOGETHER. The relative form needs uv >= 0.9.17. Older uv
# does not reject it -- 0.9.3 prints 'failed to parse year in date "7 days"' during
# settings discovery and then resolves AS IF THE KEY WERE ABSENT, exit 0. Lowering the
# pin below 0.9.17 therefore does not disable this control, it makes it silently inert,
# which is worse. The pin lives in Makefile UV_VERSION, Dockerfile and
# .github/workflows/trader_joe_testing.yml env.UV_VERSION; all three must agree.
#
# Layout is load-bearing for the scanner, not for uv: exclude-newer sits on the line
# directly below the table header and these notes stay above it. The rule keys off the
# literal table header, so a header spelled out inside a comment reads to it as a second,
# empty uv table and it reports the cooldown missing while it is in fact set. Hence the
# header is named nowhere above. Same setting either way -- only the placement differs.
[tool.uv]
exclude-newer = "7 days"
default-groups = ["base", "dev", "testing"]
# agent-mcp and security resolve SEPARATELY. semgrep (security) caps pyjwt below 2.14, the release
# that fixes the advisories pip-audit reports against 2.13.0, which the MCP SDK pulls in; one shared
# resolution cannot satisfy both. Nothing installs the two together: the venv sync and `init` leave
# agent-mcp out, the MCP image takes agent-mcp only, and CI's security job takes security only.
conflicts = [[{ group = "agent-mcp" }, { group = "security" }]]

[dependency-groups]
base = [
    "aenum>=3.1.16",
    # Keep this floor even though fastapi now pulls a fixed starlette: fastapi declares
    # `starlette>=0.46.0` with no upper bound, so without an explicit floor a resolver is
    # free to pick a vulnerable version straight back. 1.3.1 is the lowest release that
    # clears every advisory against the previously locked 0.48.0 — the two HIGH ones are
    # GHSA-7f5h-v6xp-fcq8 (Range-header O(n^2) DoS, fixed 0.49.1) and GHSA-82w8-qh3p-5jfq
    # (request.form() limits silently ignored, fixed 1.3.1), plus GHSA-86qp-5c8j-p5mr,
    # GHSA-wqp7-x3pw-xc5r, GHSA-x746-7m8f-x49c and GHSA-jp82-jpqv-5vv3.
    "starlette>=1.3.1",
    # Still the plain distribution, but no longer because anything blocks the extra: semgrep
    # 1.177.0 takes `rich>=13.5.2` unbounded, so rich-toolkit pulling rich 15.x resolves fine
    # now. Adopting `[standard]` is an open decision about what it drags in — tj-abme9y.
    "fastapi>=0.141.1",
    # gRPC, both sides on grpc.aio (ADR tj-8konfu D2). In base because both services install it.
    # EXACT PINS, and these two move together with grpcio-tools in dev: every generated
    # *_pb2_grpc.py records the grpcio-tools version and refuses to import under an older grpcio,
    # and every *_pb2.py checks the protobuf runtime against the protoc that wrote it.
    # 1.81.1 rather than the newer 1.84.0 the cooldown admits: grpc 1.82 and later require
    # protobuf>=7.35.1, while semgrep 1.177.0 (security group) pins opentelemetry ~=1.37.0, whose
    # opentelemetry-proto caps protobuf below 7. One resolution holds both groups, so 1.81.1 is the
    # newest line that resolves. Lift all three when semgrep's opentelemetry admits protobuf 7, then
    # run `make proto` and commit the regenerated tree.
    "grpcio==1.81.1",
    "grpcio-health-checking==1.81.1",
    # The rich status on the wire: google.rpc.Status in the grpc-status-details-bin trailer, which
    # carries ErrorInfo and RetryInfo beside the code (ADR tj-fa1rpu's 2026-09-30 addendum; tj-8konfu
    # D6.4; AIP-193). common/rpc/errors.py renders and parses it. Pinned exactly and moving with the
    # two pins above for the same reason grpcio-health-checking does: all three are published from one
    # grpc release and grpcio-status declares `grpcio>=1.81.1`, so a lone bump would drag grpcio past
    # the version the generated code was written against.
    "grpcio-status==1.81.1",
    # grpcio-status already requires it, but common/rpc/errors.py imports google.rpc.status_pb2 and
    # google.rpc.error_details_pb2 by name, and this repo declares what its code imports rather than
    # leaning on a transitive pin (common/tests/test_declared_imports.py, and the sqlalchemy[asyncio]
    # comment in data-store). Until now it reached the lock only through the security group's
    # opentelemetry, so no image installed it. A floor and no cap: it ships nothing but generated
    # protobuf modules, and 1.75.3 is what the resolution already held.
    "googleapis-common-protos>=1.75.3",
    # Imported by the generated *_pb2.py, which common/rpc loads in both prod images; it moves with the
    # grpc pins above. A floor and no <7 cap: the generated code's runtime check
    # (google/protobuf/runtime_version.py, 6.33.6) refuses a runtime OLDER than the gencode, not a newer
    # major, and grpcio-health-checking 1.81.1 already holds protobuf below 7 until those pins lift.
    "protobuf>=6.33.6",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.37.0",
]
dev = [
    "debugpy>=1.8.17",
    # The protoc `make proto` runs (it bundles libprotoc 33.5). Not a runtime dependency: services
    # import the committed generated code and never generate, so prod never installs it (the dev
    # image does, as it does everything in this group). Pinned exactly because its version is
    # written into every generated file, so an unpinned generator would make CI's staleness check
    # fail on a version bump rather than on a contract change (ADR tj-8konfu D1). Moves with the
    # grpcio pins in base.
    "grpcio-tools==1.81.1",
]
testing = [
    "ruff>=0.14.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    # Test-only: a real async pool without Postgres for the Docker-free component tests.
    # Never add it to base, a service group or dev -- dev is baked into the service dev
    # image (ADR tj-8z213c, Addendum 1).
    "aiosqlite>=0.22.1",
    # Imported directly by data/ingest/tests/test_alpaca_cut_connection.py (ProtocolError).
    "urllib3>=2.8.0",
    # Imported directly by common/tests/test_ci_invariants.py and test_agent_mcp_groups.py (Requirement, Version).
    "packaging>=26.3",
    # Imported directly by common/tests (compose_model.py, test_ci_invariants.py, ...) and tools/agent_mcp/tests.
    "pyyaml>=6.0.3",
]
data-ingest = [
    "alpaca-py>=0.42.2",
    # Imported directly by data/ingest/app/brokers/alpaca/classify.py (typed-error classification).
    "requests>=2.34.2",
]
data-store = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.13",
    # The [asyncio] extra, not the plain distribution: the async store imports
    # sqlalchemy.ext.asyncio, which runs on greenlet. Plain sqlalchemy declares greenlet
    # only behind a platform_machine marker, so it lands in the lock incidentally and any
    # re-resolution is free to drop it — measured, it did: a forced re-lock refreshed 61
    # packages, removed greenlet and took the suite to 1 failed, 1 error, 250 passed. The
    # extra names what the code actually requires instead of relying on that marker.
    #
    # The <2.1 cap is deliberate (tj-bzcbb8). uv's default prerelease mode takes a pre-release
    # whenever no stable release satisfies a requirement, and the install cooldown can create
    # exactly that: with the >=2.0.54 floor younger than the window, a re-lock picked
    # 2.1.0rc2 and three data/store tests failed, so 2.1 is not a drop-in. A global
    # `prerelease = "explicit"` would cover every package, but measured, it makes the security
    # group unresolvable: semgrep needs the opentelemetry 0.58b0 betas, which are published only
    # as betas. Lift the cap as a decision when Dependabot proposes 2.1 final, not by re-lock.
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
]
# The agent-stack MCP server (tools/agent_mcp, ADR tj-4rr0la addendum 1). Installed by
# tools/agent_mcp/Dockerfile ONLY: in no stage of the service Dockerfile, not in
# default-groups, not in the Makefile's venv sync and not in CI's test installs. The pip-audit
# export in `make security` still covers it, because that export takes every group but the
# dev, testing and security ones. It resolves apart from security (the conflicts entry under
# the uv table explains why), so semgrep's own mcp and pyjwt pins do not hold this group back.
agent-mcp = [
    "mcp>=1.29.0",
    # Imported directly by tools/agent_mcp/server.py, which builds the Starlette app and runs uvicorn
    # itself. Base declares both too, but the MCP image installs this group alone. Plain uvicorn, not
    # [standard]: the server needs no extra, and the extra would add packages to the MCP image.
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
    # Not imported here: a floor on mcp's own dependency, the starlette pattern in base. mcp
    # declares pyjwt with no bound that excludes 2.13.0, and pip-audit reports ten advisories
    # against 2.13.0, all fixed in 2.14.0 (CVE-2026-101917, CVE-2026-102265 to -102269, -102271
    # to -102274), and one more against 2.14.0, fixed in 2.15.0 (CVE-2026-101918). Without the
    # floor a re-lock is free to pick either straight back.
    "pyjwt>=2.15.0",
]
security = [
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
    "semgrep>=1.140.0",
]

[tool.ruff]
# Ruff only ever reads .py, so most of the list below is not about the files that are
# there now -- it is about the ones a directory could acquire. A helper script dropped
# into .github/ or .claude/ is tooling, not this project's source, and should not start
# failing the lint gate the day someone adds it. Each entry held no Python when it was
# added, so nothing linted today stops being linted.
exclude = [
    ".beads",
    # Agent configuration, and the live worktrees beneath it (tj-aov3ip): half-edited
    # copies of this whole repo. Without this, a root-level run lints every other
    # agent's tree as if it were ours -- 687 files instead of 118, with findings
    # against code that does not exist on this branch.
    ".claude",
    ".devcontainer",
    ".git",
    ".github",
    "docs",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".venv-devcontainer",
    ".vscode",
    "__pypackages__",
    # Generated alembic revisions. A PATH glob, resolved against this file's directory, so it took
    # the server/ prefix with the move (epic tj-iontkq, C-5): a glob that stops matching does not
    # fail lint, it quietly starts linting what it used to exclude.
    "server/data/store/migrations/versions/*",
    # protoc output (ADR tj-8konfu D3 as reversed 2026-10-05; decision tj-3mk3u5.42 F1), generated
    # code like the revisions above: `make proto` writes gen/proto/python and nothing under it is
    # committed, so it is regenerated, never hand-edited or reformatted. Every language's tree
    # whole, the package marker `make proto` writes at trader_joe/proto/__init__.py included. The
    # exclusion still has to be here even though the tree is untracked: ruff walks the working
    # directory, not the index, and `make test` has just written it.
    "gen/proto",
    # The UI's home (tj-iontkq.1). Not Python and not generated: TypeScript, its build config and
    # node_modules. Listed for the reason at the top of this list -- a tooling script dropped in
    # here, or a vendored vendor directory, should not start failing the Python lint gate. The
    # UI's generated TypeScript is not here either; it is gen/proto/ts, under the entry above.
    "web/**",
    # Bind-mounted container state, not source. The Postgres data directory inside is
    # root-owned and unreadable from this container, so a scan that walks it ERRORS
    # rather than skipping -- the reason this one is not merely tidiness.
    "volumes",
    "volume_data",
]

line-length = 120
target-version = "py312"
# so `ruff format <explicit path>` still honours exclude
force-exclude = true

[tool.ruff.lint]
# DTZ and ASYNC are permanent (tj-vhboky.30 item 3); PERF, RET, PIE and PTH are not, on purpose.
# TID251 is banned-api: it does nothing without the flake8-tidy-imports.banned-api table below, and
# that table does nothing without it (ADR tj-8konfu D3).
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "TID251", "TID252", "TC", "D", "DTZ", "ASYNC"]
ignore = [
    "E501", # line length — the formatter owns it
    "E402", # module-level import not at top: FastAPI pattern (routers imported after app)
    # PEP 695 generics: no autofix, and the 9 sites are Pydantic generic models on the
    # cross-service contract. Migrating them is its own task. (Count re-derived on
    # tj-mzaub8 after the Kafka RPC layer went: it was 17 while that layer existed.)
    "UP046",
    # UP047 is the function-level half of the same PEP 695 migration (get_env_var in
    # common/environment.py), ignored on UP046's reasoning rather than a new one. It
    # surfaced only because the uv cooldown's re-lock carried ruff 0.14.1 -> 0.16.8.
    "UP047",
    # Same re-lock, and NOT cosmetic: UP042 wants `class X(str, Enum)` to become
    # enum.StrEnum, which changes what str(X.MEMBER) returns -- 'X.MEMBER' for a str-Enum,
    # the bare value for a StrEnum. These 4 enums are serialised across the gRPC
    # cross-service contract and Pydantic schemas, so the migration needs its own task and
    # its own tests, not a line in a dependency bump. The sites also straddle two agents'
    # scopes (schemas, routers/common, data/ingest), so no one owner can do it. (Count and
    # transport re-derived on tj-mzaub8; it was 7 across the Kafka RPC contract.)
    "UP042",
    # docstring style, not presence
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads annotations at runtime
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

# THE gRPC SEAM (ADR tj-8konfu D3, re-homed by addendum A1; decision tj-3mk3u5.42 F1): no module
# outside common/rpc/ imports a generated symbol. The generated package is trader_joe.proto, from
# gen/proto/python, which configuration puts on the import path; its stubs are an implementation
# detail of common/rpc, and everything else goes through the hand-written code there. One entry covers
# every contract beneath trader_joe.proto: ruff matches an import against the banned name and each of
# its parents, which is proven by a lint shown failing on a deliberate violation in tj-3mk3u5.23's
# notes. common/rpc itself is exempted below.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"trader_joe.proto".msg = "generated gRPC code (trader_joe.proto) is private to common/rpc; use the hand-written API there (ADR tj-8konfu D3)"

[tool.ruff.lint.per-file-ignores]
# EVERY KEY HERE IS A PATH GLOB, resolved against this file's directory, so the four service trees
# carry the server/ prefix they gained in epic tj-iontkq -- unlike known-first-party below, which
# names import names and did not move. A glob that stops matching fails SILENTLY: the ignores just
# stop applying, and nobody notices until someone touches a handler.
# The one package allowed to import generated gRPC code: the seam above.
"server/common/rpc/**" = ["TID251"]
# FastAPI evaluates handler annotations at runtime; B008 is the Depends() idiom
"server/routers/**" = ["TC001", "TC002", "TC003", "B008"]
# the tests build naive datetimes on purpose, to prove they are refused
"**/tests/**" = ["DTZ001"]
# `timeout` here is a retry deadline that returns False, not an operation timeout, so
# asyncio.timeout would change behaviour; kept as-is by user ruling (tj-mvqbaf, 2026-09-28)
"server/common/database/postgres_tools.py" = ["ASYNC109"]

[tool.ruff.lint.isort]
lines-after-imports = 2
# matches format.skip-magic-trailing-comma
split-on-trailing-comma = false
# IMPORT NAMES, NOT PATHS, so the move into server/ (epic tj-iontkq) left every one of them
# correct: PYTHONPATH points at the server root, so common, data, routers and schemas are still
# the top-level package names. Do not prefix these -- unlike the path globs above, which had to be.
# (The superseded plan had this list become ["trader_joe"]; that is not what happened.)
# trader_joe is first-party already: the generated trader_joe.proto (gen/proto/python) is this
# repository's own code -- built from proto/ rather than committed, which changes nothing about
# where its imports sort. tj-iontkq.5 adds the hand-written trader_joe.common beside it.
known-first-party = ["common", "data", "routers", "schemas", "trader_joe"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100
