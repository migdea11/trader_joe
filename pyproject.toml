[project]
name = "trader-joe"
version = "0.1.0"
description = "FastAPI based algo trading platform"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[tool.uv]
default-groups = ["base", "dev", "testing"]

[dependency-groups]
base = [
    "aenum>=3.1.16",
    # pin a safe minimum for starlette. Remove once fastapi update is available.
    "starlette>=0.47.2",
    "fastapi>=0.119.0", # revert to standard once semgrep issue resolved
    "httpx>=0.28.1",
    "kafka-python-ng>=2.2.3",
    "pydantic>=2.12.3",
    "python-dotenv>=1.1.1",
    "uvicorn[standard]>=0.37.0",
]
dev = [
    "debugpy>=1.8.17",
]
testing = [
    "ruff>=0.14.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]
data-ingest = [
    "alpaca-py>=0.42.2",
]
data-store = [
    "alembic>=1.17.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0.44",
]
security = [
    "bandit>=1.8.6",
    "pip-audit>=2.9.0",
    "safety>=3.6.2",
    "semgrep>=1.140.0",
]

[tool.ruff]
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "data/store/migrations/versions/*",
]

line-length = 120
target-version = "py312"
# so `ruff format <explicit path>` still honours exclude
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "TID252", "TC", "D"]
ignore = [
    "E501", # line length — the formatter owns it
    "E402", # module-level import not at top: FastAPI pattern (routers imported after app)
    # PEP 695 generics: no autofix, and the 17 sites are Pydantic generic models on the
    # cross-service contract plus the Kafka RPC layer. Migrating them is its own task.
    "UP046",
    # docstring style, not presence
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads annotations at runtime
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates handler annotations at runtime; B008 is the Depends() idiom
"routers/**" = ["TC001", "TC002", "TC003", "B008"]

[tool.ruff.lint.isort]
lines-after-imports = 2
# matches format.skip-magic-trailing-comma
split-on-trailing-comma = false
# becomes ["trader_joe"] after Phase 1
known-first-party = ["common", "data", "routers", "schemas"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100
