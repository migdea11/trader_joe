name: Trader Joe Testing

# ---------------------------------------------------------------------------
# RULE -- no live broker credential in a branch-triggered workflow (tj-59cce6)
#
# Nothing triggered by `push` or `pull_request` may reference a secret that
# authenticates to a broker or to a brokerage account. That includes anything
# named ALPACA_*, IBKR_*, QUESTRADE_* or the equivalent for a future adapter,
# and it holds whether the account is paper or live.
#
# Why: every job that holds such a secret exposes it to code on an unreviewed
# branch and to every third-party action in that job. Pinning actions by SHA
# lowers the probability of compromise; it does not lower the blast radius,
# and blast radius is what matters when the asset is a trading credential.
# Today the key is an Alpaca paper key, so the loss is bounded. The same job
# shape at Phase 2 holds a credential that can place real orders in a
# registered account -- hence the rule now, while it is cheap and boring.
#
# System and smoke tests therefore run without a real vendor. They assert the
# stack comes up and answers; they do not exercise a broker account.
#
# If a credentialed run is ever genuinely needed, it does NOT come back here.
# It goes in a SEPARATE workflow whose only trigger is `workflow_dispatch`,
# with `environment:` set to a GitHub Environment configured with required
# reviewers. That workflow is deliberately not built yet -- build it when a
# use case actually appears, not speculatively.
#
# `secrets.GITHUB_TOKEN` and `secrets.SAFETY_API_KEY` are not broker
# credentials and are unaffected by this rule.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Deny by default at workflow level; every job declares the scopes it needs and
# nothing else. `packages: write` in particular belongs only to Image Build --
# declared here it would also hand a registry-push token to the lint job and to
# the security job, which runs a third-party action with an API key.
permissions: {}

env:
  UV_VERSION: "0.9.3"
  SOURCE_PATHS: "./common ./router ./schemas ./data"

jobs:
  testing:
    name: Linting and Unit Testing
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    permissions:
      contents: read  # checkout only
    env:
      UV_LINK_MODE: copy
      POSTGRES_ASYNC: true
      POSTGRES_SYNC: true

    steps:
    - uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v6
      with:
        version: "${{ env.UV_VERSION }}"

    - name: Install dependencies
      run: |
        uv sync --all-groups --no-group security --locked
    - name: Run Ruff Linting
      run: |
        uv run ruff check .
    - name: Run Ruff Format Check
      run: |
        uv run ruff format --check .
    - name: Run Unit Tests
      run: |
        uv run pytest -s

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only; pyupio/safety-action runs here, so no more
    steps:
    - uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v6
      with:
        version: "${{ env.UV_VERSION }}"

    - name: Install Security Group
      run: |
        uv sync --only-group security --locked

    - name: Run Bandit
      run: |
        uv run bandit -r ${{ env.SOURCE_PATHS }} --exclude tests/

    - name: Run SemGrep
      run: |
        uv run semgrep --config=auto --exclude=tests/ --exclude=.venv --exclude=docker-compose.override.yaml .

    - name: Generate Requirements
      run: |
        uv export --all-groups --no-group dev --no-group testing --no-group security --locked --format requirements-txt > requirements.txt

    - name: Run Safety CLI
      uses: pyupio/safety-action@v1
      with:
        api-key: ${{ secrets.SAFETY_API_KEY }}

    - name: Run Pip-Audit
      run: |
        uv run pip-audit -r requirements.txt --disable-pip

  build:
    name: Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      packages: write  # the only job that pushes to ghcr.io
    needs:
      - testing
      - security
    outputs:
      BRANCH_NAME: ${{ steps.branch_name.outputs.BRANCH_NAME }}
      IMAGE_STORE: ${{ steps.push_store.outputs.IMAGE }}
      IMAGE_INGEST: ${{ steps.push_ingest.outputs.IMAGE }}

    steps:
    - uses: actions/checkout@v4

    - name: Get Branch Name
      id: branch_name
      run: |
        # set as a step output so other jobs can consume it
        echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

    - name: Get Commit Hash
      id: commit_hash
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Registry Login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Images
      run: |
        cp .env.default .env
        cp data/ingest/.env.default data/ingest/.env
        cp data/store/.env.default data/store/.env
        # .env.default ships no database password on purpose (tj-glqs4r) and compose
        # refuses to interpolate without one -- it fails the whole file, build included.
        # This runner's Postgres is thrown away with the job, so a throwaway password is
        # the right answer; a shared secret would only be one more thing to leak.
        printf '\nPOSTGRES_PASS=%s\n' "$(openssl rand -hex 24)" >> .env
        docker compose -f docker-compose.yaml build
        docker images  # List built images

    - name: Push Image - Data Store
      id: push_store
      run: |
        # tag with short sha and push to GHCR
        IMAGE_STORE=ghcr.io/${{ github.repository_owner }}/trader_joe_data_store:${SHORT_SHA}
        docker tag trader_joe_data_store $IMAGE_STORE
        docker push $IMAGE_STORE
        echo "IMAGE=$IMAGE_STORE" >> $GITHUB_OUTPUT

    - name: Push Image - Data Ingest
      id: push_ingest
      run: |
        IMAGE_INGEST=ghcr.io/${{ github.repository_owner }}/trader_joe_data_ingest:${SHORT_SHA}
        docker tag trader_joe_data_ingest $IMAGE_INGEST
        docker push $IMAGE_INGEST
        echo "IMAGE=$IMAGE_INGEST" >> $GITHUB_OUTPUT

    - name: Setup Pipeline Configs
      run: |
        mkdir -p artifact
        cp docker-compose.yaml artifact/
        cp .env.default artifact/.env.default

        mkdir -p artifact/data/ingest artifact/data/store
        cp data/ingest/.env.default artifact/data/ingest/.env.default
        cp data/store/.env.default artifact/data/store/.env.default
        ls -lahR artifact/

    - name: Push Pipeline Configs
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-configs-${{ steps.branch_name.outputs.BRANCH_NAME }}
        path: artifact/
        include-hidden-files: true

  system:
    name: System Testing
    runs-on: ubuntu-latest
    permissions:
      packages: read  # pulls the images Image Build pushed; no checkout, so no contents
    needs:
      - build

    steps:
      - name: Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Pipeline Configs
        uses: actions/download-artifact@v5
        with:
          name: pipeline-configs-${{ needs.build.outputs.BRANCH_NAME }}
          path: artifact

      - name: Stage Pipeline Configs
        run: |
          ls -lahR artifact/
          cp artifact/docker-compose.yaml ./docker-compose.yaml
          cp artifact/.env.default ./.env
          # Same throwaway credential as the build job, regenerated here: the two jobs
          # run on different runners and this one is the one that actually starts
          # Postgres, so the value only has to be consistent within this job.
          printf '\nPOSTGRES_PASS=%s\n' "$(openssl rand -hex 24)" >> .env

          mkdir -p data/ingest
          cp artifact/data/ingest/.env.default data/ingest/.env
          mkdir -p data/store
          cp artifact/data/store/.env.default data/store/.env


      - name: Pull Docker Images
        run: |
          echo "Pulling ${{ needs.build.outputs.IMAGE_STORE }}"
          docker pull ${{ needs.build.outputs.IMAGE_STORE }}
          echo "Pulling ${{ needs.build.outputs.IMAGE_INGEST }}"
          docker pull ${{ needs.build.outputs.IMAGE_INGEST }}

          docker tag ${{ needs.build.outputs.IMAGE_STORE }} trader_joe_data_store
          docker tag ${{ needs.build.outputs.IMAGE_INGEST }} trader_joe_data_ingest
          docker images  # Verify images are loaded

      # No "Add Runtime Configs" step: this job writes no ALPACA_* value at all, not
      # even a placeholder one. The placeholders were only ever needed because
      # data/ingest/app/brokers/alpaca/broker_api.py built its Alpaca client at import
      # time. It now builds lazily, per request, so data_ingest imports and starts with
      # both variables unset -- and data/ingest/.env.default ships them commented out.
      # The smoke test below asserts /ping on both services and one data_store read
      # through to Postgres; none of those reaches the broker, so nothing here needs a
      # credential, real or fake. Do not reintroduce a step that writes one.

      - name: Start System
        run: |
          ls -lah
          docker compose -f docker-compose.yaml up -d
          docker ps  # Verify containers are running

      - name: Clean Runtime Configs
        if: always()
        run: |
          shred -u .env || rm -f .env
          shred -u data/ingest/.env || rm -f data/ingest/.env
          shred -u data/store/.env || rm -f data/store/.env

    # - name: Push Data Store Image
    #   run: |
    #     docker tag trader_joe_data_store ghcr.io/${{ github.repository_owner }}/trader_joe_data_store:${{ env.SHORT_SHA }}
    #     docker tag trader_joe_data_store ghcr.io/${{ github.repository_owner }}/trader_joe_data_store:latest
    #     docker push ghcr.io/${{ github.repository_owner }}/trader_joe_data_store:${{ env.SHORT_SHA }}
    #     docker push ghcr.io/${{ github.repository_owner }}/trader_joe_data_store:latest

    # - name: Push Data Ingest Image
    #   run: |
    #     docker tag trader_joe_data_ingest ghcr.io/${{ github.repository_owner }}/trader_joe_data_ingest:${{ env.SHORT_SHA }}
    #     docker tag trader_joe_data_ingest ghcr.io/${{ github.repository_owner }}/trader_joe_data_ingest:latest
    #     docker push ghcr.io/${{ github.repository_owner }}/trader_joe_data_ingest:${{ env.SHORT_SHA }}
    #     docker push ghcr.io/${{ github.repository_owner }}/trader_joe_data_ingest:latest