name: Trader Joe Testing

# ---------------------------------------------------------------------------
# RULE -- no live broker credential in a branch-triggered workflow (tj-59cce6)
#
# Nothing triggered by `push` or `pull_request` may reference a secret that
# authenticates to a broker or to a brokerage account. That includes anything
# named ALPACA_*, IBKR_*, QUESTRADE_* or the equivalent for a future adapter,
# and it holds whether the account is paper or live.
#
# Why: every job that holds such a secret exposes it to code on an unreviewed
# branch and to every third-party action in that job. Pinning actions by SHA
# lowers the probability of compromise; it does not lower the blast radius,
# and blast radius is what matters when the asset is a trading credential.
# Today the key is an Alpaca paper key, so the loss is bounded. The same job
# shape at Phase 2 holds a credential that can place real orders in a
# registered account -- hence the rule now, while it is cheap and boring.
#
# System and smoke tests therefore run without a real vendor. They assert the
# stack comes up and answers; they do not exercise a broker account.
#
# If a credentialed run is ever genuinely needed, it does NOT come back here.
# It goes in a SEPARATE workflow whose only trigger is `workflow_dispatch`,
# with `environment:` set to a GitHub Environment configured with required
# reviewers. That workflow is deliberately not built yet -- build it when a
# use case actually appears, not speculatively.
#
# `secrets.GITHUB_TOKEN` and `secrets.SAFETY_API_KEY` are not broker
# credentials and are unaffected by this rule.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# RULE -- every `uses:` is pinned to a full 40-character commit SHA (tj-cg2i9p)
#
# A tag is a mutable pointer. `@v4` is a name the action's owner can repoint at
# any commit at any time, so a workflow pinned to one executes whatever that
# name means at the moment the job starts -- with this repository's contents and
# this job's token. That is not hypothetical: it is how the tj-actions/changed-
# files, trivy-action and kics-github-action compromises reached their
# downstream consumers, in each case without any version appearing to move.
#
# The SHA is the only immutable reference GitHub offers. The trailing `# vX.Y.Z`
# comment is not decoration: Dependabot reads it to know which release a pin
# corresponds to, and rewrites BOTH the SHA and the comment when it opens an
# update. Drop the comment and the pin still works but stops being updatable by
# anything except a human reading changelogs -- see .github/dependabot.yml,
# which exists for precisely this reason.
#
# WHEN ADDING A STEP: look the SHA up, do not copy one from memory or from
# another repository. `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` gives the
# ref; if it returns `"type": "tag"` it is an annotated tag and must be
# dereferenced through `git/tags/<sha>` to reach the commit. A pin nobody
# verified is worse than the mutable tag it replaced, because it looks
# deliberate.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Deny by default at workflow level; every job declares the scopes it needs and
# nothing else. `packages: write` in particular belongs only to Image Build --
# declared here it would also hand a registry-push token to the lint job and to
# the security job, which runs a third-party action with an API key.
permissions: {}

env:
  # Floor, not a preference: below 0.9.17 uv silently ignores the `exclude-newer`
  # install cooldown in pyproject.toml. Matches Makefile UV_VERSION and the Dockerfile.
  UV_VERSION: "0.12.19"
  # No uv command in this workflow may re-lock (tj-3zh7ss). Every `uv run` below installs the
  # committed uv.lock as-is instead of re-resolving it, so CI is covered by this setting and not
  # by the order of its steps. The explicit `--locked` on sync and export still wins over it:
  # uv warns, then asserts the lock is current, so a stale lock still fails the job. Matches the
  # Makefile's exported UV_FROZEN.
  UV_FROZEN: "1"
  # bandit's roots, and they must stay character-for-character the Makefile's SOURCE_DIRS:
  # common/tests/test_ci_invariants.py compares the two invocations as argv. The four service
  # trees moved under ./server in epic tj-iontkq.4; ./tools and ./gen stay at the top of the
  # repository. Get a root wrong and bandit scans nothing and exits 0.
  SOURCE_PATHS: "./server/common ./server/routers ./server/schemas ./server/data ./tools ./gen/proto/python"

jobs:
  testing:
    name: Linting and Unit Testing
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    permissions:
      contents: read  # checkout only
    env:
      UV_LINK_MODE: copy
      POSTGRES_ASYNC: true
      POSTGRES_SYNC: true

    steps:
    # debian:bookworm-slim ships neither git nor make, and the suite needs both: the Makefile tests
    # run make, and the tracked-file and ignore-rule tests run git from the checkout root. Before
    # checkout on purpose: with no git on PATH, actions/checkout falls back to a REST API tarball
    # that has no .git, and every git test then fails even with git installed. ca-certificates
    # because --no-install-recommends leaves it out, and git fetches over https (tj-ijpys9.16).
    #
    # jq because the harness-hook tests (common/tests/test_harness_hooks.py, tj-qenrpk) run the
    # PreToolUse hook commands in .claude/settings.json verbatim, and each one starts with jq.
    # Without jq a hook falls through its `|| true` and allows every command, so those tests check
    # for it first and fail, never skip (pytest.ini). The agent image installs it, so only this job
    # would go red (tj-3mk3u5.40). grep -P, the hooks' other tool, needs nothing here: bookworm's
    # grep is Essential, so the slim image has it, and it pre-depends on libpcre2-8-0.
    #
    # curl because `make buf-install` (Install Buf, below) and `make shellcheck-install` (Install
    # ShellCheck, below) download their pinned releases with it, and the slim image has none
    # (tj-3mk3u5.54, tj-xc6nfv). ca-certificates serves them too: both downloads are https.
    # tar and gzip need no entry: both are Essential in Debian, so the slim image has them, which is
    # why the shellcheck pin takes the release's .tar.gz and not its smaller .tar.xz (xz-utils is not
    # Essential, and the agent image has no xz binary at all).
    #
    # safe.directory: the runner creates the workspace as its own user and this container runs as
    # root, so git refuses the checkout for dubious ownership. actions/checkout marks the workspace
    # safe only in a temporary global config that it deletes when its own step ends, so later steps
    # do not inherit it. --system, in /etc/gitconfig, where checkout's HOME override cannot hide it.
    - name: Install Git, Make, jq and curl
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git make jq curl ca-certificates
        rm -rf /var/lib/apt/lists/*
        git config --system --add safe.directory "${GITHUB_WORKSPACE}"

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Install UV
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "${{ env.UV_VERSION }}"

    - name: Install dependencies
      run: |
        uv sync --all-groups --no-group security --no-group agent-mcp --locked

    # THE PINNED BUF, through the target a developer runs (tj-3mk3u5.54), so the version and both
    # checksums have one definition, the Makefile's: the bare release binary, sha256-verified against
    # the pin, refused on a mismatch. Before Run Linters, whose proto leg needs it, and before Run Unit
    # Tests, because tests in the suite run the real buf. No cache: one small download per run.
    - name: Install Buf
      run: |
        make buf-install BUF_INSTALL_DIR=/usr/local/bin

    # THE PINNED SHELLCHECK (tj-xc6nfv), through the target a developer runs, for the same reason buf
    # goes through make buf-install: the version and both checksums have one definition, the
    # Makefile's. NOT the Debian package -- bookworm ships shellcheck 0.9.0, and a linter at a
    # different version than the one agents run locally reports a different set of findings, which
    # makes a green local `make lint` mean nothing about CI. Before Run Linters, whose shell leg needs
    # it, and also before Run Unit Tests, for the reason buf is: the suite runs the real pinned binary
    # (test_make_lint.py's real_buf fixture, which FAILS rather than skips when it is absent). No test
    # reaches shellcheck yet -- that is tj-s2tf38 -- and the step is ordered now so adding one later
    # is a test change and not a CI change. No cache: one 4 MB download per run.
    - name: Install ShellCheck
      run: |
        make shellcheck-install SHELLCHECK_INSTALL_DIR=/usr/local/bin

    # THE PINNED NODE AND THE WEB DEPENDENCIES (tj-grna9p.27), for Run Linters below: `make lint`
    # covers web/ too (eslint and vue-tsc, the lint-ts leg), so this job installs what that leg needs
    # rather than lint behaving differently here than for a developer. Through `make node-install`,
    # for the buf reason: the version and both checksums have one definition, the Makefile's, and the
    # tarball is sha256-verified. The slim image has curl, tar and gzip. The web job below runs the
    # rest of the web chain.
    - name: Install Node
      run: |
        make node-install NODE_INSTALL_DIR=/usr/local/bin NODE_HOME_DIR=/usr/local/lib/nodejs

    - name: Install Web Dependencies
      run: |
        make web-install

    # buf breaking's baseline (tj-3mk3u5.54). actions/checkout fetches one commit and no branch, so
    # main is fetched here as a remote-tracking ref, and make lint is pointed at it. Depth 1: make
    # lint extracts one tree from it with git archive and needs no history. On a push to main this
    # writes refs/remotes/origin/main, never the checked-out branch.
    - name: Fetch main for buf breaking
      run: |
        git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

    # THE gRPC CODEGEN. Nothing under gen/ is committed (user ruling 2026-10-05, reversing ADR
    # tj-8konfu D3 and decision tj-3mk3u5.42 F1), so this checkout has no generated tree and Run
    # Unit Tests below -- a bare `uv run pytest`, not `make test` -- would collect nothing that
    # reaches trader_joe.proto. It builds the tree instead of judging it: this step used to be a
    # staleness check that regenerated and failed on any difference, the control that made
    # committing the output safe. With nothing committed there is nothing to go stale, so the check
    # is unnecessary rather than merely redundant and is gone, not weakened. Through `make proto`,
    # the target a developer runs, so the protoc invocation still has exactly one definition.
    - name: Generate gRPC Code
      run: |
        make proto

    # THE STALENESS CONTROL, for docs/errors.md -- now the only generated artefact this repository
    # commits (ADR tj-fa1rpu, Q-URI addendum; tj-3mk3u5.37.10). The catalogue is generated from the
    # one Reason table in server/common/errors and IS committed, so it can disagree with its source;
    # gen/proto/ no longer can, because nothing under it is committed. It regenerates through
    # `make errors-doc`, the target a developer runs, and reads `git status` rather than `git diff`:
    # a file that is missing or untracked is stale too. The generator's own `--check` mode is the
    # in-suite twin of this step.
    - name: Check Generated Error Catalogue
      run: |
        set -eu
        make errors-doc
        stale="$(git status --porcelain --untracked-files=all -- docs/errors.md)"
        if [ -n "${stale}" ]; then
          echo "::error::docs/errors.md does not match what make errors-doc writes from server/common/errors; run 'make errors-doc' and commit the result"
          printf '%s\n' "${stale}"
          git --no-pager diff -- docs/errors.md
          exit 1
        fi
        echo "docs/errors.md matches what make errors-doc writes from server/common/errors."

    # THE ONE LINT ENTRY POINT, the same target every agent and developer runs (tj-3mk3u5.54), so the
    # linters have one definition, as protoc does through make proto above. PATHS
    # defaults to '.', so this is ruff check and ruff format --check on the whole tree, then the shell
    # leg (shellcheck over every *.sh git lists, tj-xc6nfv), then the proto leg: buf lint, buf format
    # --diff --exit-code and buf breaking against main. Breaking is
    # REPORT-ONLY until the first SDK release (tj-d2mhru): a break prints as annotations on the pull
    # request and does not fail the step; a broken check still does. After the codegen step, so ruff
    # reads the same tree the suite imports.
    - name: Run Linters
      run: |
        make lint BUF_AGAINST_REF=origin/main BUF_ERROR_FORMAT=github-actions

    - name: Run Unit Tests
      run: |
        uv run pytest -s

  # THE WEB JOB (tj-grna9p.27): the UI's whole chain from a clean checkout, every step through the
  # make target a developer runs. Nothing generated is committed (user ruling 2026-10-06), so there
  # is no staleness check: the TypeScript is regenerated from proto/ into gen/proto/ts, which this
  # checkout does not have, and then type-checked, linted, tested and built. A proto change that
  # breaks the UI fails here at vue-tsc.
  # NODE has ONE authority, the Makefile's NODE_VERSION. This workflow holds no Node version and uses
  # no setup-node: `make node-install` fetches that release and checks its sha256, and every web
  # target refuses a node that does not report it. buf, which gen:proto needs, goes the same way.
  # Both install under $HOME/.local/bin, put first on PATH for the later steps through GITHUB_PATH.
  web:
    name: Web (lint, typecheck, test, build, audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Install Buf
      run: |
        make buf-install BUF_INSTALL_DIR="${HOME}/.local/bin"
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

    - name: Install Node
      run: |
        make node-install NODE_INSTALL_DIR="${HOME}/.local/bin"
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

    - name: Install Web Dependencies
      run: |
        make web-install

    - name: Generate TypeScript from Proto
      run: |
        make gen-proto-ts

    - name: Lint
      run: |
        make web-lint

    - name: Typecheck
      run: |
        make web-typecheck

    - name: Test
      run: |
        make web-test

    - name: Build
      run: |
        make web-build

    # TWO PARTS (see web-audit in the Makefile): the full npm audit, dev tooling included, is
    # REPORT-ONLY (dev-only findings are tracked as risk tj-s5dqya and must not turn this job red);
    # then the gate, npm audit --omit=dev --audit-level=high, which fails on any high or critical
    # finding in a runtime dependency. The full report prints first so it is in the log either way.
    - name: Audit
      run: |
        make web-audit

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only; pyupio/safety-action runs here, so no more
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Install UV
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "${{ env.UV_VERSION }}"

    - name: Install Security Group
      run: |
        uv sync --only-group security --locked

    # '*/tests/*', not 'tests/': bandit turns an exclude naming an existing directory into
    # '<dir>/*', so the repository-root tests/ made 'tests/' stop matching every nested tests
    # directory (tj-vhboky.67). Identical to the Makefile's security target; change both.
    - name: Run Bandit
      run: |
        uv run bandit -r ${{ env.SOURCE_PATHS }} --exclude '*/tests/*'

    # --error makes semgrep exit non-zero on any finding, so this step fails on findings rather
    # than only proving semgrep ran (tj-cg2i9p). A fresh checkout has no .claude/worktrees; the
    # exclude keeps this line identical to `make security`, where agent worktrees do exist
    # (tj-aov3ip). '*.spec.ts' keeps the web test specs out as tests/ keeps the Python tests out
    # (tj-grna9p.106). Change both or neither.
    - name: Run SemGrep
      run: |
        uv run semgrep --config=auto --error --exclude=tests/ --exclude='*.spec.ts' --exclude=.venv --exclude=docker-compose.override.yaml --exclude=.claude/worktrees .

    # --color never, the same command as the Makefile's security target (tj-3mk3u5.43): uv colours
    # its output when the environment forces colour, even into this redirect, and pip-audit cannot
    # parse the escape codes. This job forces none, so here the flag changes no package line.
    - name: Generate Requirements
      run: |
        uv export --all-groups --no-group dev --no-group testing --no-group security --locked --format requirements-txt --color never > requirements.txt

    - name: Run Safety CLI
      # No semver tag exists on this commit -- pyupio publishes the moving `v1` only, so the
      # comment names the tag rather than a release. The pin is still immutable; Dependabot
      # just has a coarser signal to bump it from than the other five.
      uses: pyupio/safety-action@7baf6605473beffc874c1313ddf2db085c0cacf2  # v1
      with:
        api-key: ${{ secrets.SAFETY_API_KEY }}

    - name: Run Pip-Audit
      run: |
        uv run pip-audit -r requirements.txt --disable-pip

  build:
    name: Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      packages: write  # the only job that pushes to ghcr.io
    needs:
      - testing
      - security
    outputs:
      BRANCH_NAME: ${{ steps.branch_name.outputs.BRANCH_NAME }}
      IMAGE_STORE: ${{ steps.push_store.outputs.IMAGE }}
      IMAGE_INGEST: ${{ steps.push_ingest.outputs.IMAGE }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Get Branch Name
      id: branch_name
      run: |
        # set as a step output so other jobs can consume it
        echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

    - name: Get Commit Hash
      id: commit_hash
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    # The Dockerfile COPYs ./gen/proto/python out of the build context and nothing under gen/ is
    # committed, so this job has to write it before `docker compose build` -- there is no other
    # source for it, and a missing COPY source fails the build. uv is here for that one target and
    # nothing else in this job; `make proto` needs grpcio-tools, which lives in the dev group.
    - name: Install UV
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "${{ env.UV_VERSION }}"

    - name: Generate gRPC Code
      run: |
        make proto

    - name: Registry Login
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Images
      run: |
        cp .env.default .env
        cp server/data/ingest/.env.default server/data/ingest/.env
        cp server/data/store/.env.default server/data/store/.env
        # .env.default ships no database password on purpose (tj-glqs4r) and compose
        # refuses to interpolate without one -- it fails the whole file, build included.
        # This runner's Postgres is thrown away with the job, so a throwaway password is
        # the right answer; a shared secret would only be one more thing to leak.
        printf '\nPOSTGRES_PASS=%s\n' "$(openssl rand -hex 24)" >> .env
        docker compose -f docker-compose.yaml build
        docker images  # List built images

    - name: Check Compose Renders
      run: |
        set -euo pipefail
        # Every compose set the Makefile and CI load must still interpolate and merge, including
        # the ones no job in this workflow starts: a broken override or tools file would
        # otherwise surface only on a developer's machine. The env files Build Images staged
        # are what the files interpolate from, so this step follows it.
        #
        # --quiet ALWAYS. Without it `config` prints the fully interpolated model, and that
        # model carries POSTGRES_PASS in data_store's DATABASE_URI -- straight into the log.
        #
        # The prod set, the dev set (base plus override), the tools set and the client set, in
        # the same file order the Makefile uses for each. The tools set gets the same throwaway
        # PGADMIN_* placeholders dev-down uses, only to get past its ":?" guards; they are safe
        # here for the same reason, because `config` creates no container and so no pgAdmin
        # account can ever be initialised from them.
        #
        # The prod and dev sets now carry the web overlays (bead tj-mcrwrd), whose INSTANCE_WRITE_SECRET
        # has a ":?" guard: it gets the same throwaway placeholder, safe for the same reason (`config`
        # creates nothing, and the placeholder never reaches a container).
        #
        # The agent-stack set, spelled exactly as the Makefile's AGENT_STACK_COMPOSE: project
        # trader_joe_agent_stack, then base, test-client, the agent-stack overlay and the
        # fake-mode overlay LAST (ADR tj-4rr0la addendum 3 (3); decision tj-j4wknb R4). The
        # agent-stack overlay reads six variables through ":?" guards with no default --
        # DATABASE_NAME, STORE_API_NETWORK, DATA_DIR and the three *_ENV_FILE
        # paths -- which the MCP server's generated env file supplies at run time, so this line
        # sets throwaway placeholders for all six, safe for the same reason as PGADMIN_*:
        # `config` creates no container, network, volume or directory. The names differ from the
        # user's defaults (db, trader_joe_store_api) only so a placeholder can never be
        # taken for a real resource. With --quiet this line proves that the set interpolates and
        # merges, and nothing more; which names the merged agent-stack model carries is pinned
        # in-process by the build_infra tests (tj-c4mosr.5). The three *_ENV_FILE placeholders
        # are NOT arbitrary: `config` refuses an env_file that does not exist, so they name the
        # root, server/data/store and server/data/ingest env files Build Images already staged
        # above, as absolute paths the way the generated env file spells them (the step runs at the
        # checkout root, so ${PWD} is it). Naming a path is not reading the file. Whoever
        # changes AGENT_STACK_COMPOSE updates this line.
        #
        # The fake-mode system set, spelled as the Makefile's SYSTEM_COMPOSE (what make
        # system-launch starts; tj-vhboky.61): the default project, base then the fake-mode
        # overlay. The overlay adds no variable, so it needs no env beyond the base file's.
        #
        # The agent-stack MCP's own project (docker-compose.agent-mcp.yaml; ADR tj-4rr0la addendum
        # 11 R5), spelled as the Makefile's AGENT_MCP_COMPOSE: project trader_joe_agent_mcp and an
        # empty --env-file, so no env file is read. Its five ":?" variables -- three host paths and
        # the build's UID/GID -- get throwaway placeholders, safe for the same reason: `config`
        # creates nothing, and it does not check that a bind source exists. Nothing else in CI
        # reads this file before the host sitting (tj-c4mosr.6).
        AGENT_MCP_REPO_HOST_PATH=/tmp/agent_mcp_render_repo AGENT_MCP_STACK_DIR=/tmp/agent_mcp_render_stack \
          AGENT_MCP_SHARE_PATH=/tmp/agent_mcp_render_share AGENT_MCP_UID=1000 AGENT_MCP_GID=1000 \
          docker compose -p trader_joe_agent_mcp --env-file /dev/null -f docker-compose.agent-mcp.yaml config --quiet
        INSTANCE_WRITE_SECRET=unused docker compose -f docker-compose.yaml -f docker-compose.web.yaml \
          config --quiet
        INSTANCE_WRITE_SECRET=unused docker compose -f docker-compose.yaml -f docker-compose.override.yaml \
          -f docker-compose.web.yaml -f docker-compose.web.dev.yaml config --quiet
        PGADMIN_EMAIL=unused PGADMIN_PASS=unused INSTANCE_WRITE_SECRET=unused docker compose \
          -f docker-compose.yaml -f docker-compose.override.yaml -f docker-compose.web.yaml \
          -f docker-compose.web.dev.yaml -f docker-compose.tools.yaml config --quiet
        docker compose -f docker-compose.yaml -f docker-compose.test-client.yaml config --quiet
        DATABASE_NAME=agent_stack_render_db \
          STORE_API_NETWORK=agent_stack_render_store_api DATA_DIR=/tmp/agent_stack_render_data \
          ROOT_ENV_FILE="${PWD}/.env" STORE_ENV_FILE="${PWD}/server/data/store/.env" \
          INGEST_ENV_FILE="${PWD}/server/data/ingest/.env" \
          docker compose -p trader_joe_agent_stack -f docker-compose.yaml \
          -f docker-compose.test-client.yaml -f docker-compose.agent-stack.yaml \
          -f docker-compose.fake.yaml config --quiet
        docker compose -f docker-compose.yaml -f docker-compose.fake.yaml config --quiet
        echo "Compose renders: prod, dev, tools, client, agent-stack, agent-mcp and fake-mode system sets all interpolate and merge."

    - name: Push Image - Data Store
      id: push_store
      run: |
        # tag with short sha and push to GHCR
        IMAGE_STORE=ghcr.io/${{ github.repository_owner }}/trader_joe_data_store:${SHORT_SHA}
        docker tag trader_joe_data_store $IMAGE_STORE
        docker push $IMAGE_STORE
        echo "IMAGE=$IMAGE_STORE" >> $GITHUB_OUTPUT

    - name: Push Image - Data Ingest
      id: push_ingest
      run: |
        IMAGE_INGEST=ghcr.io/${{ github.repository_owner }}/trader_joe_data_ingest:${SHORT_SHA}
        docker tag trader_joe_data_ingest $IMAGE_INGEST
        docker push $IMAGE_INGEST
        echo "IMAGE=$IMAGE_INGEST" >> $GITHUB_OUTPUT

    - name: Setup Pipeline Configs
      run: |
        mkdir -p artifact
        cp docker-compose.yaml artifact/
        cp .env.default artifact/.env.default

        mkdir -p artifact/data/ingest artifact/data/store
        cp server/data/ingest/.env.default artifact/data/ingest/.env.default
        cp server/data/store/.env.default artifact/data/store/.env.default

        # The migration scripts travel with the configs because System Testing has no
        # checkout and the schema has to exist before anything can query it. The prod
        # image ships alembic and psycopg2 (the data-store dependency group) but not
        # these files -- the Dockerfile copies server/data/store/app only -- so compose
        # bind-mounts them over /code/alembic.ini and /code/migrations. Without them
        # staged, those two mounts point at paths that do not exist on that runner and
        # docker silently materialises empty directories.
        cp server/data/store/alembic.ini artifact/data/store/alembic.ini
        cp -r server/data/store/migrations artifact/data/store/migrations
        # Bytecode from this runner's interpreter is not useful to the container and
        # only makes the artifact bigger.
        find artifact/data/store/migrations -name __pycache__ -type d -prune -exec rm -rf {} +
        ls -lahR artifact/

    - name: Push Pipeline Configs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: pipeline-configs-${{ steps.branch_name.outputs.BRANCH_NAME }}
        path: artifact/
        include-hidden-files: true
        overwrite: true

  system:
    name: System Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout: the system suite (tests/system) runs from the source tree
      packages: read  # pulls the images Image Build pushed
    needs:
      - build

    steps:
      # The stack still runs from the images Image Build pushed and the configs it staged; the
      # checkout exists only to build test_client and hand it the system suite (tests/system),
      # which it runs against that stack. Into the workspace root, not a subdirectory: make
      # test-system only needs the project env file to exist in its own working directory, and
      # compose interpolates from it; the Stage step below writes that file here. No credential is
      # persisted into the checkout's config -- nothing in this job fetches or pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "${{ env.UV_VERSION }}"

      # One step in this job uses the host venv these two steps build: Seed Dump, whose host-side
      # writer (python -m data.store.seeds.bundle) runs in it. make test-system has no venv
      # prerequisite and runs no uv sync: the suite runs inside test_client, whose image installs
      # its own groups, and every other step works through docker compose.
      - name: Install dependencies
        run: |
          uv sync --all-groups --no-group security --no-group agent-mcp --locked

      # docker-compose.test-client.yaml bind-mounts ./gen/proto/python into test_client read-only,
      # and nothing under gen/ is committed, so this checkout has to write it: an absent bind-mount
      # source is created as an empty directory and the suite dies on a missing trader_joe.proto.
      # make test-system's own existence guard refuses before that, which is the loud version of the
      # same thing; this step is what satisfies it.
      - name: Generate gRPC Code
        run: |
          make proto

      - name: Registry Login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Pipeline Configs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: pipeline-configs-${{ needs.build.outputs.BRANCH_NAME }}
          path: artifact

      - name: Stage Pipeline Configs
        run: |
          set -euo pipefail
          ls -lahR artifact/
          cp artifact/docker-compose.yaml ./docker-compose.yaml
          cp artifact/.env.default ./.env
          # Same throwaway credential as the build job, regenerated here: the two jobs
          # run on different runners and this one is the one that actually starts
          # Postgres, so the value only has to be consistent within this job. Masked before
          # it is written anywhere: the system suite now holds it too, and a failing test's
          # output is one more place it could otherwise surface.
          db_pass="$(openssl rand -hex 24)"
          echo "::add-mask::${db_pass}"
          printf '\nPOSTGRES_PASS=%s\n' "${db_pass}" >> .env

          # A throwaway INSTANCE_WRITE_SECRET, generated the same way and for the same reason:
          # the template ships it empty, the write routes fail closed without it, and the
          # system suite (make test-system) refuses to start without one. Registered with the
          # runner's log masking BEFORE anything can print it, and never echoed. It is not a
          # broker credential -- it authenticates this job's own data_store to its own test
          # client and nothing else -- so the tj-59cce6 rule at the top of this file is
          # unaffected. The template's empty line is deleted rather than overridden, so the
          # staged file holds exactly one value for every reader: compose, the make recipe and
          # the secret-lifecycle step below.
          write_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${write_secret}"
          sed -i '/^INSTANCE_WRITE_SECRET=/d' .env
          printf 'INSTANCE_WRITE_SECRET=%s\n' "${write_secret}" >> .env

          mkdir -p server/data/ingest
          cp artifact/data/ingest/.env.default server/data/ingest/.env
          mkdir -p server/data/store
          cp artifact/data/store/.env.default server/data/store/.env
          # Restored to the exact paths docker-compose.yaml bind-mounts into data_store:
          # ./server/data/store/alembic.ini -> /code/alembic.ini and
          # ./server/data/store/migrations -> /code/migrations. The artifact keeps its own flat
          # data/... layout, which is this workflow's invention and not a checkout path; only the
          # destinations here have to match compose. alembic resolves
          # script_location=migrations against the container's WORKDIR (/code), so both have to
          # land here, not anywhere else.
          # The checkout already holds a migrations directory at that path, and cp -r into an
          # existing directory nests the copy one level down (migrations/migrations), which
          # would leave the mounted tree as the checkout's rather than the artifact's. Remove
          # it first, so what is mounted is exactly what Image Build staged beside the images.
          cp artifact/data/store/alembic.ini server/data/store/alembic.ini
          rm -rf server/data/store/migrations
          cp -r artifact/data/store/migrations server/data/store/migrations

      # THE CLIENT (decision record tj-q9ae5u, addendum 1). Prod publishes no host port, so
      # nothing on this runner can reach data_store from outside the stack: every HTTP request
      # this job makes to it goes from test_client, a container on store_api, by service name.
      # Three compose spellings, and only three, in this job:
      #   the stack   docker compose -f docker-compose.yaml ...  -- run --no-deps, exec, logs,
      #               ps, down. It never loads the client file, so migrating, blanking and
      #               inspecting data_store cannot depend on it. None of these creates a service
      #               container, so they keep the base file alone.
      #   the fake stack
      #               docker compose -f docker-compose.yaml -f docker-compose.fake.yaml -- for
      #               `up` and nothing else (FAKE MODE, decision tj-j4wknb R4): make
      #               system-launch starts the stack with it, so data_ingest runs the test-only
      #               launcher on FakeRead, and the lifecycle step's data_store recreate repeats
      #               it, so no container is ever created without the overlay -- or data_ingest
      #               would silently come back on the production entrypoint.
      #   the client  docker compose -f docker-compose.yaml -f docker-compose.test-client.yaml
      #               -- and only ever to build or run test_client (run: --rm --no-deps -T, plus
      #               --pull never wherever stdout is captured).
      # make seed-dump runs inside its own recipe with base + fake + client (pinned in
      # test_seed_dump_make.py), a spelling this job never writes out.
      # Built here from this job's checkout, before Start System and after Stage, because the
      # base file cannot interpolate without the staged POSTGRES_PASS. make test-system rebuilds
      # it with --build, which then finds every layer cached.
      - name: Build Test Client
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yaml -f docker-compose.test-client.yaml build test_client

      - name: Pull Docker Images
        run: |
          echo "Pulling ${{ needs.build.outputs.IMAGE_STORE }}"
          docker pull ${{ needs.build.outputs.IMAGE_STORE }}
          echo "Pulling ${{ needs.build.outputs.IMAGE_INGEST }}"
          docker pull ${{ needs.build.outputs.IMAGE_INGEST }}

          docker tag ${{ needs.build.outputs.IMAGE_STORE }} trader_joe_data_store
          docker tag ${{ needs.build.outputs.IMAGE_INGEST }} trader_joe_data_ingest
          docker images  # Verify images are loaded

      # No "Add Runtime Configs" step: this job writes no ALPACA_* value at all, not
      # even a placeholder one. The placeholders were only ever needed because
      # data/ingest/app/brokers/alpaca/broker_api.py built its Alpaca client at import
      # time. It now builds lazily, per request, so data_ingest imports and starts with
      # both variables unset -- and data/ingest/.env.default ships them commented out.
      # The smoke test below asserts /ping on both services and one data_store read
      # through to Postgres; none of those reaches the broker, so nothing here needs a
      # credential, real or fake. Do not reintroduce a step that writes one.

      - name: Start System
        # make system-launch refuses without this attestation. It holds by construction here: the
        # runner's database is thrown away with the job. Set on this step only, like System Tests.
        env:
          SYSTEM_TEST_DISPOSABLE_DB: "1"
        run: |
          set -euo pipefail
          ls -lah
          # IN FAKE MODE (decision tj-j4wknb R4, tj-vhboky.61), through the same target a developer
          # runs: the prod images and the prod compose file (decision tj-0rpt9t), plus
          # docker-compose.fake.yaml, which mounts tests/fakes read-only into data_ingest and swaps
          # its command for the test-only launcher -- FakeRead in the broker slot, no vendor, no
          # credential. The Smoke Test asserts nothing that depends on the mode; the overlay is
          # what lets the system suite and the seed producer fetch bars at all.
          #
          # --wait, not a bare up -d (the recipe's own flags). `up -d` returns once the
          # containers are CREATED, so a service that boots and dies two seconds later still left
          # this step green. With every service declaring a healthcheck, --wait blocks until
          # each one reports healthy and exits non-zero if any goes unhealthy or dies; its
          # --wait-timeout 300 sits well above the apps' own start periods, so a
          # hung stack fails the job rather than burn the runner's six hours.
          make system-launch
          docker compose -f docker-compose.yaml ps  # health column, not just liveness

      - name: Check Fake Broker
        run: |
          set -euo pipefail
          # FAKES-1: the launcher logs ONE WARNING starting 'FAKE BROKER:' at import, and the
          # production entrypoint never does. Checked BEFORE anything talks to the stack, so a
          # data_ingest that came up on the production entrypoint (an overlay dropped from Start
          # System) fails here, by name, rather than as a confusing failure deep in the suite or
          # the seed producer. The logs are captured first and grepped after, so grep stopping
          # early can never break the pipe under pipefail. The banner holds no secret: it is
          # printed. grep exiting 1 means no banner, which the check below reports.
          logs="$(docker compose -f docker-compose.yaml logs --no-color --no-log-prefix data_ingest)"
          banner="$(printf '%s\n' "${logs}" | { grep -E 'WARNING.*FAKE BROKER:' || [ $? -eq 1 ]; })"
          if [ -z "${banner}" ]; then
            echo "::error::data_ingest's logs carry no 'FAKE BROKER:' WARNING; it is not running the fake-mode launcher"
            exit 1
          fi
          echo "data_ingest is in fake mode: ${banner}"

      - name: Migrate Database
        run: |
          # Nothing else ever creates the schema. entrypoint.sh runs uvicorn and nothing
          # else; data_store's lifespan calls database.initialize(), which opens the engine
          # and does not create a single table; there is no migration service in
          # docker-compose.yaml. A healthy stack therefore has an EMPTY database, and every
          # /store request answers 500 with an UndefinedTable error -- so the assertion in
          # the next step would be red forever without this.
          #
          # --no-deps because the stack is already up and healthy; without it compose
          # re-resolves postgres for a container that needs nothing started on its behalf.
          # `run` publishes no ports, so this cannot collide with the running data_store.
          # The command is an explicit argv: the image sets CMD, not ENTRYPOINT, so passing
          # one replaces entrypoint.sh rather than appending to it.
          #
          # upgrade head, never create_all (tj-6bvoic): the schema the system suite runs
          # against is the one the migrations build, which is the only one prod ever has. See
          # data/store/tests/test_market_activity_idempotency.py, whose docstring concedes the
          # Postgres-only property that tests/system now checks against this database.
          set -euo pipefail
          docker compose -f docker-compose.yaml run --rm --no-deps data_store \
            /code/.venv/bin/alembic upgrade head

          # Then prove it landed where it was aimed: the revision the database records must be
          # the single head the migration scripts report. alembic logs to stderr (alembic.ini's
          # console handler), but anything imported on the way may still print to stdout, so a
          # revision is only ever a line LED by a 12-hex-digit id: grep extracts those ids and
          # nothing else, and the head count is a count of ids, not of lines. grep exiting 1
          # means no id at all, which the checks below report; 2 is an error and fails the step.
          # -T: no TTY, so no carriage returns in what is compared. --pull never: a missing image
          # fails loudly instead of mixing pull progress into the captured output.
          #
          # NOTHING ELSE runs on this database -- no downgrade, no re-upgrade. A downgrade over
          # the empty database this job has just migrated proves nothing (user ruling,
          # tj-vhboky.47): the round trip only means something against rows. It needs seeded
          # data, so it moved with the seed work to the fake-broker PR (epic tj-irhy0a,
          # tj-vhboky.62).
          revisions() {
            docker compose -f docker-compose.yaml run --rm --no-deps -T --pull never data_store \
              /code/.venv/bin/alembic "$1" | { grep -Eo '^[0-9a-f]{12}\b' || [ $? -eq 1 ]; }
          }
          heads="$(revisions heads)"
          current="$(revisions current)"
          head_count="$(printf '%s\n' "${heads}" | { grep -cE '^[0-9a-f]{12}$' || [ $? -eq 1 ]; })"
          echo "alembic heads: ${heads:-<none>}; current: ${current:-<none>}"
          if [ "${head_count}" -ne 1 ]; then
            echo "::error::expected exactly one migration head, got: ${heads:-<none>}"
            exit 1
          fi
          if [ "${current}" != "${heads}" ]; then
            echo "::error::database is at revision ${current:-<none>}, not the head ${heads}"
            exit 1
          fi

      - name: Smoke Test
        run: |
          set -euo pipefail

          # Read the container port out of the staged .env rather than sourcing it -- sourcing
          # would also pull POSTGRES_PASS into this shell's environment, and the only thing
          # that buys is one more place a stray `set -x` could print it. APP_INTERNAL_PORT is
          # not a secret: it is the port both apps listen on inside their containers. The same
          # env_value as the Instance Secret Lifecycle step: the last line for a key wins, as it
          # does for compose, and the value is everything after the first `=`.
          env_value() { grep -E "^$1=" .env | tail -n 1 | cut -d= -f2-; }
          APP_INTERNAL_PORT="$(env_value APP_INTERNAL_PORT)"

          # WHY NO HOST PORT. Prod publishes nothing (tj-q9ae5u addendum 1): data_store sits on
          # three internal networks and data_ingest on ingest_store plus its egress bridge, so
          # there is no 127.0.0.1 mapping for the runner to curl, and adding one here would test
          # a topology prod does not have. So each request goes from inside the stack, by
          # compose service name, exactly as a real client would reach it:
          #   data_store   from test_client, which joins store_api -- the strategy clients' path.
          #   data_ingest  from inside data_store, which proves ingest_store carries HTTP
          #                between the two apps; test_client cannot reach data_ingest at all,
          #                and Check Network Lockdown below proves that it cannot.
          # Each fetcher prints the body, a newline and the HTTP status, like curl -w below.
          from_client() {
            docker compose -f docker-compose.yaml -f docker-compose.test-client.yaml \
              run --rm --no-deps -T --pull never --entrypoint curl test_client \
              -sS --max-time 20 -w '\n%{http_code}' "$1"
          }
          # data_store has no curl (see its healthcheck), so its own interpreter fetches.
          # http.client, not urlopen: it does not raise on a 4xx/5xx, so the status and the body
          # of a failure are printed like any other, where urlopen would bury them in a trace.
          from_data_store() {
            docker compose -f docker-compose.yaml exec -T data_store /code/.venv/bin/python -c \
              'import http.client, sys, urllib.parse; u = urllib.parse.urlsplit(sys.argv[1]); c = http.client.HTTPConnection(u.hostname, u.port, timeout=20); c.request("GET", u.path); r = c.getresponse(); sys.stdout.write(r.read().decode() + "\n" + str(r.status))' \
              "$1"
          }

          assert_http() {
            fetch="$1"; name="$2"; url="$3"; want_body="$4"
            # No -f on curl: --fail suppresses the response body on a 4xx/5xx, and the body
            # is exactly what makes a failure here diagnosable instead of an opaque number.
            if ! response="$("${fetch}" "$url")"; then
              echo "::error::${name}: ${fetch} could not complete a request to ${url}"
              return 1
            fi
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            echo "${name}: GET ${url} -> HTTP ${status}"
            echo "${name}: body: ${body}"
            if [ "${status}" != "200" ]; then
              echo "::error::${name}: expected HTTP 200 from ${url}, got ${status}; body: ${body}"
              return 1
            fi
            # Status alone is not enough. A 200 carrying an error payload is the next false
            # green after the `docker ps` one this job is replacing, so the body is checked
            # against the exact document the handler is supposed to return.
            if [ "${body}" != "${want_body}" ]; then
              echo "::error::${name}: expected body ${want_body} from ${url}, got: ${body}"
              return 1
            fi
          }

          assert_http from_client "data_store ping (from test_client)" \
            "http://data_store:${APP_INTERNAL_PORT}/ping" '{"message":"pong"}'
          assert_http from_data_store "data_ingest ping (from data_store)" \
            "http://data_ingest:${APP_INTERNAL_PORT}/ping" '{"message":"pong"}'

          # The one request that actually proves something new. /ping is what the container
          # healthchecks already probe, so re-asserting it adds nothing; this route runs
          # data_store's own path into Postgres end to end -- Depends(async_db) hands the
          # handler a session and search_entries() executes a real SELECT with an outer join
          # and a GROUP BY against store_dataset_entry. It reaches no peer service, which is
          # what makes it the cheapest read that covers app -> database -> app.
          #
          # [] is the correct answer, not an empty-ish one: the query ran, matched no rows
          # for this deliberately synthetic symbol, and came back. A missing schema, a
          # refused connection or a bad credential all produce a 500 instead, and a failure
          # here prints the body and then the `if: failure()` step below dumps the logs.
          assert_http from_client "data_store dataset search (from test_client)" \
            "http://data_store:${APP_INTERNAL_PORT}/store/stock/market-activity/SMOKETEST" '[]'

          echo "Smoke test passed: both services answered /ping by service name and data_store served a query from Postgres."

      - name: Check gRPC Bind Network
        run: |
          set -euo pipefail
          # THE BIND-NETWORK CHECK, first half (ADR tj-q9ae5u addendum 3; tj-3mk3u5.49). data_ingest's
          # gRPC server binds APP_INTERNAL_GRPC_HOST, the data-ingest-grpc alias docker-compose.yaml
          # declares on its ingest_store attachment only, and never a wildcard. This proves the NAME
          # before anything binds it: inside data_ingest, the host resolves to data_ingest's address
          # on ingest_store and to nothing else. A name answering with its ingest_egress address
          # would still let the server start cleanly, bound where data_store cannot reach it, so no
          # other step here would notice. Nothing here dials the port: the reachability half, data_store
          # calling gRPC health on the name, is Check gRPC Peer Reach, the next step (tj-3mk3u5.25).
          #
          # IF THIS FAILS ON A MISMATCH, the alias design itself is wrong: report it to the
          # architect. Never "fix" it with 0.0.0.0, the service name or the hostname.
          #
          # Both variables must be in the CONTAINER's environment: the base file's environment:
          # block has to reach this fake-overlay launch, as it must every launch. Read with the
          # image's own interpreter (no printenv-is-missing ambiguity); neither value is a secret.
          container_env() {
            docker compose -f docker-compose.yaml exec -T data_ingest /code/.venv/bin/python -c \
              'import os, sys; print(os.environ.get(sys.argv[1], "").strip())' "$1"
          }
          grpc_host="$(container_env APP_INTERNAL_GRPC_HOST)"
          grpc_port="$(container_env APP_INTERNAL_GRPC_PORT)"
          echo "data_ingest APP_INTERNAL_GRPC_HOST=${grpc_host:-<unset or empty>} APP_INTERNAL_GRPC_PORT=${grpc_port:-<unset or empty>}"
          if [ -z "${grpc_host}" ] || [ -z "${grpc_port}" ]; then
            echo "::error::data_ingest's container environment lacks APP_INTERNAL_GRPC_HOST or APP_INTERNAL_GRPC_PORT; docker-compose.yaml's environment: block did not reach this launch"
            exit 1
          fi

          # The resolution, by the same call common.rpc's refuse_wildcard makes before the server
          # binds: getaddrinfo(host, None, SOCK_STREAM). One address per line, any IPv6 %zone cut.
          if ! resolved_raw="$(docker compose -f docker-compose.yaml exec -T data_ingest /code/.venv/bin/python -c \
              'import socket, sys; print("\n".join(sorted({info[4][0].split("%")[0] for info in socket.getaddrinfo(sys.argv[1], None, type=socket.SOCK_STREAM)})))' \
              "${grpc_host}")"; then
            echo "::error::${grpc_host} does not resolve inside data_ingest"
            exit 1
          fi

          # data_ingest's own addresses on every network, from the engine rather than from inside the
          # container, so the expectation does not share the resolver it is checking. The network
          # whose name ends _ingest_store (the project prefixes it) must be exactly one.
          container="$(docker compose -f docker-compose.yaml ps -q data_ingest)"
          if [ -z "${container}" ]; then
            echo "::error::no data_ingest container to inspect"
            exit 1
          fi
          networks="$(docker inspect --format '{{range $name, $net := .NetworkSettings.Networks}}{{$name}} {{$net.IPAddress}} {{$net.GlobalIPv6Address}}{{println}}{{end}}' "${container}")"
          echo "data_ingest networks (name, IPv4, IPv6):"
          printf '%s\n' "${networks}"
          ingest_store="$(printf '%s\n' "${networks}" | awk '$1 ~ /_ingest_store$/')"
          matches="$(printf '%s\n' "${ingest_store}" | awk 'NF { n++ } END { print n + 0 }')"
          if [ "${matches}" -ne 1 ]; then
            echo "::error::expected data_ingest on exactly one network named *_ingest_store, found ${matches}"
            exit 1
          fi

          resolved="$(printf '%s\n' "${resolved_raw}" | awk 'NF' | LC_ALL=C sort -u)"
          expected="$(printf '%s\n' "${ingest_store}" | awk '{ for (i = 2; i <= NF; i++) print $i }' | LC_ALL=C sort -u)"
          echo "${grpc_host} resolves inside data_ingest to: $(printf '%s' "${resolved}" | tr '\n' ' ')"
          echo "data_ingest's ingest_store address(es): $(printf '%s' "${expected}" | tr '\n' ' ')"
          if [ -z "${expected}" ]; then
            echo "::error::docker inspect reports no address for data_ingest on ingest_store"
            exit 1
          fi
          if [ "${resolved}" != "${expected}" ]; then
            echo "::error::${grpc_host} resolves inside data_ingest to [$(printf '%s' "${resolved}" | tr '\n' ' ')], not to its ingest_store address(es) [$(printf '%s' "${expected}" | tr '\n' ' ')] alone; report to the architect (ADR tj-q9ae5u addendum 3), never fall back to a wildcard"
            exit 1
          fi
          echo "gRPC bind name holds: ${grpc_host} resolves inside data_ingest to its ingest_store address only (port ${grpc_port})."

      - name: Check gRPC Peer Reach
        run: |
          set -euo pipefail
          # THE PEER-REACH CHECK, the bind-network check's second half (ADR tj-q9ae5u addendum 3;
          # tj-3mk3u5.25), and -- since addendum 5 item 7 -- the CLIENT-CONFIGURATION check too. From
          # inside data_store -- the peer data_ingest's gRPC exists to serve -- call the standard
          # grpc.health.v1 Health.Check for service '' and require SERVING. data_ingest's own healthcheck
          # already reads SERVING, but it dials from inside data_ingest, where it succeeds on whichever
          # interface the server is bound to. Only a call from data_store proves the listener sits on the
          # network the two share, ingest_store. The step before proved the name resolves to that
          # network's address alone.
          #
          # WHAT IS DIALLED IS data_store's OWN DATA_INGEST_GRPC_TARGET (addendum 5): the one entry every
          # data_store -> data_ingest client reads through common.rpc.channel's target_from_env, which has
          # no default and fails loudly. Composing the address here from data_ingest's two variables
          # instead would prove the network path while a missing or wrong target passed unnoticed -- and
          # from tj-3mk3u5.10 the dataset path dials that target on every launch. CI System Testing is the
          # one runtime check that sees compose precedence (environment: over env_file:), so it is the only
          # place a target that drifted from the bind can be caught before a DEADLINE_EXCEEDED in prod.
          #
          # The equality check comes first and is not a fallback: on a mismatch the step fails with BOTH
          # values and dials nothing. Reconstructing the address from the server's side would be exactly
          # the hole this closes. data_ingest's host and port are read back from its CONTAINER environment
          # the same way as the step before; none of these values is a secret. Never a loopback address.
          container_env() {
            docker compose -f docker-compose.yaml exec -T data_ingest /code/.venv/bin/python -c \
              'import os, sys; print(os.environ.get(sys.argv[1], "").strip())' "$1"
          }
          store_env() {
            docker compose -f docker-compose.yaml exec -T data_store /code/.venv/bin/python -c \
              'import os, sys; print(os.environ.get(sys.argv[1], "").strip())' "$1"
          }
          grpc_host="$(container_env APP_INTERNAL_GRPC_HOST)"
          grpc_port="$(container_env APP_INTERNAL_GRPC_PORT)"
          if [ -z "${grpc_host}" ] || [ -z "${grpc_port}" ]; then
            echo "::error::data_ingest's container environment lacks APP_INTERNAL_GRPC_HOST or APP_INTERNAL_GRPC_PORT, so there is nothing to check data_store's target against"
            exit 1
          fi
          target="$(store_env DATA_INGEST_GRPC_TARGET)"
          echo "data_store DATA_INGEST_GRPC_TARGET=${target:-<unset or empty>}; data_ingest binds ${grpc_host}:${grpc_port}"
          if [ -z "${target}" ]; then
            echo "::error::data_store's container environment lacks DATA_INGEST_GRPC_TARGET; docker-compose.yaml's environment: block did not reach this launch, and every gRPC client in data_store would fail at startup (ADR tj-q9ae5u addendum 5)"
            exit 1
          fi
          if [ "${target}" != "${grpc_host}:${grpc_port}" ]; then
            echo "::error::data_store dials DATA_INGEST_GRPC_TARGET='${target}' but data_ingest binds '${grpc_host}:${grpc_port}'; the two must agree (ADR tj-q9ae5u addendum 5). Fix the compose entry or the env file that moved one end; never reconstruct the address here"
            exit 1
          fi

          # data_store's own interpreter dials, and dials the target verbatim: grpcio and
          # grpcio-health-checking are in the base group both images install. The sync API, one call with
          # a 10 s deadline and no wait_for_ready: the stack is up and healthy, so the listener must answer
          # now, and a refused or unreachable address fails at once with UNAVAILABLE rather than waiting.
          # The future's exception() hands back a failed call's code and details without raising, so they
          # are printed on stdout and captured here. Exit 0 on SERVING only: NOT_SERVING, SERVICE_UNKNOWN
          # and every RPC error are red.
          if ! out="$(docker compose -f docker-compose.yaml exec -T data_store /code/.venv/bin/python -c \
              'import sys, grpc; from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g; t = sys.argv[1]; c = grpc.insecure_channel(t); f = g.HealthStub(c).Check.future(h.HealthCheckRequest(service=""), timeout=10); e = f.exception(); s = None if e else h.HealthCheckResponse.ServingStatus.Name(f.result().status); c.close(); print(f"{t}: {e.code().name}: {e.details()}" if e else f"{t}: {s}"); sys.exit(0 if s == "SERVING" else 1)' \
              "${target}")"; then
            echo "::error::data_store did not get SERVING from data_ingest's gRPC health over ingest_store at its own DATA_INGEST_GRPC_TARGET: ${out:-<no output>}"
            exit 1
          fi
          echo "data_store -> ${out}"
          echo "gRPC peer reach holds: data_store's own DATA_INGEST_GRPC_TARGET is data_ingest's bind ${grpc_host}:${grpc_port} and gets SERVING from its gRPC health."

      - name: Check Network Lockdown
        run: |
          set -euo pipefail
          # The prod network model (tj-q9ae5u addendum 1) as the running stack enforces it, not
          # as the compose file declares it: a network that lost `internal: true`, or a service
          # that gained one, still starts green and still passes every other step here.
          #   test_client  sees data_store and Postgres only: neither data_ingest nor data_ingest's
          #                gRPC bind alias data-ingest-grpc resolves from it, and it cannot connect
          #                to data_ingest's gRPC port even by address (tj-3mk3u5.25).
          #   postgres, data_store  have no egress: a TCP connect to a public address fails. A
          #                literal IP, so the check is about routing and no DNS is involved.
          # Every negative check needs a distinct exit status for "refused as expected", so that
          # a container that failed to start, or a missing binary, can never pass as blocked.
          PUBLIC_ADDRESS="1.1.1.1"
          PUBLIC_PORT="443"
          failed=0

          # getent exits 0 on a hit and 2 when the name does not resolve; anything else is the
          # client failing to run at all. data_store must resolve first, or a client with no
          # working DNS would make both negatives below pass for the wrong reason.
          lookup() {
            docker compose -f docker-compose.yaml -f docker-compose.test-client.yaml \
              run --rm --no-deps -T --pull never --entrypoint getent test_client hosts "$1"
          }
          if found="$(lookup data_store)"; then
            echo "test_client -> data_store: resolves (${found}), as it must"
          else
            echo "::error::test_client could not resolve data_store (exit $?), so its lookups prove nothing"
            exit 1
          fi
          # data-ingest-grpc is the alias data_ingest's gRPC server binds, scoped to ingest_store,
          # which test_client never joins.
          for name in data_ingest data-ingest-grpc; do
            if found="$(lookup "${name}")"; then
              echo "::error::test_client resolved ${name} to ${found}; it must see data_store and Postgres only"
              failed=1
            else
              status=$?
              if [ "${status}" -eq 2 ]; then
                echo "test_client -> ${name}: does not resolve, as it must"
              else
                echo "::error::test_client lookup of ${name} failed with exit ${status}, not getent's not-found (2)"
                failed=1
              fi
            fi
          done

          # Exit 3 means the connect did not complete, 0 that it reached the address. data_store
          # through its own interpreter (no curl in the image): connect_ex returns the errno
          # instead of raising, and it is printed. postgres through bash's /dev/tcp, bounded by
          # timeout.
          if out="$(docker compose -f docker-compose.yaml exec -T data_store /code/.venv/bin/python -c \
              'import socket, sys; s = socket.socket(); s.settimeout(10); rc = s.connect_ex((sys.argv[1], int(sys.argv[2]))); print(f"connect errno {rc}"); sys.exit(0 if rc == 0 else 3)' \
              "${PUBLIC_ADDRESS}" "${PUBLIC_PORT}")"; then
            echo "::error::data_store connected to ${PUBLIC_ADDRESS}:${PUBLIC_PORT}; it must have no egress"
            failed=1
          else
            status=$?
            if [ "${status}" -eq 3 ]; then
              echo "data_store -> ${PUBLIC_ADDRESS}:${PUBLIC_PORT}: blocked, as it must be (${out})"
            else
              echo "::error::data_store egress probe failed with exit ${status}, not a refused connect (3): ${out}"
              failed=1
            fi
          fi
          if out="$(docker compose -f docker-compose.yaml exec -T postgres bash -c \
              'if timeout 10 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null; then echo connected; exit 0; fi; echo "no connection"; exit 3' \
              probe "${PUBLIC_ADDRESS}" "${PUBLIC_PORT}")"; then
            echo "::error::postgres connected to ${PUBLIC_ADDRESS}:${PUBLIC_PORT}; it must have no egress"
            failed=1
          else
            status=$?
            if [ "${status}" -eq 3 ]; then
              echo "postgres -> ${PUBLIC_ADDRESS}:${PUBLIC_PORT}: blocked, as it must be (${out})"
            else
              echo "::error::postgres egress probe failed with exit ${status}, not a refused connect (3): ${out}"
              failed=1
            fi
          fi

          # data_ingest's gRPC port is out of test_client's reach (tj-3mk3u5.25). BY ADDRESS, because
          # the names do not resolve from test_client (the loop above): data_ingest's ingest_store
          # address(es), where its gRPC server listens (Check gRPC Bind Network), from the engine, and
          # the port from its container environment. The same connect and the same exit-3 convention as
          # the egress probes, so a client that failed to run never passes as blocked -- and first a
          # positive control from data_store, which shares ingest_store: each address and port must
          # accept a connection from there, or test_client's refusal would prove nothing about the
          # network. The family follows the address, so an IPv6 address is dialled as one.
          connect_code='import socket, sys; host, port = sys.argv[1], int(sys.argv[2]); s = socket.socket(socket.AF_INET6 if ":" in host else socket.AF_INET); s.settimeout(10); rc = s.connect_ex((host, port)); print(f"connect errno {rc}"); sys.exit(0 if rc == 0 else 3)'
          grpc_port="$(docker compose -f docker-compose.yaml exec -T data_ingest /code/.venv/bin/python -c \
            'import os; print(os.environ.get("APP_INTERNAL_GRPC_PORT", "").strip())')"
          ingest_container="$(docker compose -f docker-compose.yaml ps -q data_ingest)"
          if [ -z "${grpc_port}" ] || [ -z "${ingest_container}" ]; then
            echo "::error::no data_ingest container or no APP_INTERNAL_GRPC_PORT in it (port '${grpc_port}'), so its gRPC port cannot be probed"
            exit 1
          fi
          grpc_addresses="$(docker inspect --format '{{range $name, $net := .NetworkSettings.Networks}}{{$name}} {{$net.IPAddress}} {{$net.GlobalIPv6Address}}{{println}}{{end}}' "${ingest_container}" \
            | awk '$1 ~ /_ingest_store$/ { for (i = 2; i <= NF; i++) print $i }')"
          if [ -z "${grpc_addresses}" ]; then
            echo "::error::docker inspect reports no ingest_store address for data_ingest, so its gRPC port cannot be probed"
            exit 1
          fi
          for address in ${grpc_addresses}; do
            if ! out="$(docker compose -f docker-compose.yaml exec -T data_store /code/.venv/bin/python -c \
                "${connect_code}" "${address}" "${grpc_port}")"; then
              echo "::error::data_store could not connect to data_ingest's gRPC port at ${address}:${grpc_port} (${out:-no output}), so a refusal from test_client would prove nothing"
              failed=1
              continue
            fi
            if out="$(docker compose -f docker-compose.yaml -f docker-compose.test-client.yaml \
                run --rm --no-deps -T --pull never --entrypoint /code/.venv/bin/python test_client \
                -c "${connect_code}" "${address}" "${grpc_port}")"; then
              echo "::error::test_client connected to data_ingest's gRPC port at ${address}:${grpc_port}; it must reach data_store only"
              failed=1
            else
              status=$?
              if [ "${status}" -eq 3 ]; then
                echo "test_client -> data_ingest gRPC ${address}:${grpc_port}: blocked, as it must be (${out}); data_store connects"
              else
                echo "::error::test_client gRPC reach probe failed with exit ${status}, not a refused connect (3): ${out}"
                failed=1
              fi
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "Network lockdown holds: test_client does not see data_ingest and cannot reach data_ingest's gRPC port; postgres and data_store have no egress."

      - name: Check Container Env
        run: |
          set -euo pipefail
          # A container-level fact no test can see: the system suite talks to data_store over
          # HTTP and never reads the container's environment. MARKET_ACTIVITY_BATCH_SIZE comes
          # from the data_store env template through compose's env_file; unset or non-positive,
          # the bar write path refuses every batch (asset_market_activity.py). Read with the
          # image's own interpreter -- there is no printenv-is-missing ambiguity and the value is
          # not a secret, so it is printed.
          value="$(docker compose -f docker-compose.yaml exec -T data_store /code/.venv/bin/python -c \
            'import os; print(os.environ.get("MARKET_ACTIVITY_BATCH_SIZE", ""))')"
          echo "data_store MARKET_ACTIVITY_BATCH_SIZE=${value:-<unset or empty>}"
          if ! [[ "${value}" =~ ^[0-9]+$ ]] || (( 10#${value} <= 0 )); then
            echo "::error::MARKET_ACTIVITY_BATCH_SIZE in data_store must be a positive integer, got '${value}'"
            exit 1
          fi

      - name: Check Generated Code Import
        run: |
          set -euo pipefail
          # THE IMPORT-PATH CHECK (decision tj-3mk3u5.42 addendum F1-A; tj-3mk3u5.56). Inside each running
          # service built from the Dockerfile's service stages, import common.rpc.ping, which imports the
          # generated trader_joe.proto.ping.v1 and so needs /code/gen/proto/python on the container's
          # PYTHONPATH. The image's ENV puts it there, but compose ranks env_file: above an image's ENV, and
          # the staged root env file is a copy of .env.default, whose legacy PYTHONPATH=./ replaces it.
          # docker-compose.yaml's environment: restates the value and outranks both. Every static pin reads
          # the files; this is the one check that sees compose's precedence at runtime, with the very env
          # file that drops the path. Nothing else here notices a lost path while no servicer imports
          # generated code: the stack starts healthy and passes every other step.
          #
          # The image's own interpreter imports, as the services do. stdout carries only the generated
          # module's file, so a pass shows where it loaded from; a failed import's traceback reaches the log
          # on stderr, and the error names the service and the PYTHONPATH it saw (not a secret).
          failed=0
          for service in data_store data_ingest; do
            if ! path="$(docker compose -f docker-compose.yaml exec -T "${service}" /code/.venv/bin/python -c \
                'import os; print(os.environ.get("PYTHONPATH", ""))')"; then
              echo "::error::could not read PYTHONPATH inside ${service}, so its import path is unproven"
              failed=1
              continue
            fi
            if out="$(docker compose -f docker-compose.yaml exec -T "${service}" /code/.venv/bin/python -c \
                'import common.rpc.ping as ping; print(ping.ping_pb2.__file__)')"; then
              echo "${service}: common.rpc.ping imports; generated code from ${out} (PYTHONPATH=${path})"
            else
              echo "::error::${service} cannot import common.rpc.ping (the generated code under /code/gen/proto/python) with PYTHONPATH=${path:-<unset or empty>}; the traceback is above"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "The generated code imports in every service container: compose's environment: PYTHONPATH holds over the root env file."

      - name: System Tests
        # This runner's database is thrown away with the job, which is the one condition under
        # which the suite may run: it WRITES to the database it is pointed at, and the make
        # target refuses without this. Set on this step only, so nothing else in the job
        # inherits the permission.
        env:
          SYSTEM_TEST_DISPOSABLE_DB: "1"
        run: |
          set -euo pipefail
          # The same invocation a developer runs (tj-vhboky.48): the target, not a copy of its
          # pytest line, so the env contract has one definition. Ports, credentials, a non-UTC TZ
          # and PYTHONPATH live in docker-compose.test-client.yaml, which compose interpolates
          # from the staged project env file; the recipe only checks that the file exists. The
          # recipe ends on pytest, so its exit status is this step's: any failure is red, and so
          # is exit 5, an empty collection -- a suite that ran nothing has proved nothing.
          # tests/system is the counterpart of data/store/tests/test_market_activity_idempotency.py:
          # what that file's docstring concedes a unit test cannot show, these check on Postgres.
          make test-system

      - name: Seed Dump
        # The producer writes its scenario into the database it reaches, so make seed-dump has
        # the same disposable-database attestation as the suite. Set on this step only.
        env:
          SYSTEM_TEST_DISPOSABLE_DB: "1"
        run: |
          set -euo pipefail
          # THE HEAD SEED (decision tj-vhboky.55; ADR tj-4rr0la addendum 10). The same target a
          # developer runs: the producer runs in test_client (compose run --rm, entrypoint
          # overridden), POSTs its synthetic scenario to data_store -- answered with fake bars by the
          # fake-mode data_ingest -- normalises and renders the two market tables, and prints one
          # bundle line; the repo venv's python -m data.store.seeds.bundle unpacks it into SEED_OUT
          # as <revision>.sql and <revision>.json. The recipe's status is the producer's when it
          # fails, else the writer's, so a refusal (3) or a failure (1) is red here.
          #
          # ORDER, chosen on purpose: AFTER System Tests and BEFORE Instance Secret Lifecycle.
          #   Before the lifecycle step, because the producer authenticates its writes with
          #   test_client's INSTANCE_WRITE_SECRET, and that step blanks the secret in the staged
          #   env file and recreates data_store to refuse every write. After it, the producer would
          #   fail with its missing-secret error (exit 1).
          #   After System Tests, because that is where the bead puts it and because the suite
          #   removes every row it writes (tests/system/conftest.py fails its own teardown
          #   otherwise): the producer refuses a database holding any row outside its synthetic
          #   patterns, so a suite that left litter turns this step red rather than producing a seed
          #   from it. A side effect: the lifecycle step's log scan covers the producer's requests.
          #
          # SEED_OUT is job-local: inside this checkout, under the git-ignored output/, and never
          # under tests/ (the writer refuses tests/).
          make seed-dump SEED_OUT=output/ci-seed
          ls -la output/ci-seed

      # This only moves the seed off the runner, so a person can download, review and commit it.
      # It is NOT where seeds are kept: storage is the committed files under tests/system/seeds
      # (ruling on tj-vhboky.56). Hence the short retention. Before the lifecycle step like the
      # dump, and unconditional: every step up to that one is (no `if:`), so no check can be
      # skipped on the way. overwrite: a re-run attempt replaces the earlier attempt's artifact,
      # which is the newer head; without it the fixed name conflicts and the re-run fails here
      # instead of reaching the step that failed. The same key on Push Pipeline Configs, for the
      # same reason -- and no run_attempt suffix, because Pull Pipeline Configs names it exactly.
      - name: Upload Head Seed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: head-seed-${{ needs.build.outputs.BRANCH_NAME }}
          path: output/ci-seed/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Instance Secret Lifecycle
        run: |
          set -euo pipefail
          # Two properties of INSTANCE_WRITE_SECRET that need container control, so they are
          # steps here rather than tests in tests/system (test_http_write_secret.py covers the
          # rest of the matrix over HTTP). After System Tests on purpose: the log scan should see
          # every request the suite made. The value is read back from the staged project env
          # file, like the ports in Smoke Test, never sourced; it was masked when generated.
          env_value() { grep -E "^$1=" .env | tail -n 1 | cut -d= -f2-; }
          APP_INTERNAL_PORT="$(env_value APP_INTERNAL_PORT)"
          former_secret="$(env_value INSTANCE_WRITE_SECRET)"
          if [ -z "${former_secret}" ]; then
            echo "::error::no INSTANCE_WRITE_SECRET in the staged project env file; the Stage step should have written one"
            exit 1
          fi

          # (f) FIRST: no container log carries the secret. Before (e), because recreating
          # data_store discards its current container, and with it the logs of the whole suite.
          # A hit prints the container and a count, never the matching line. grep exiting 1
          # means no match and is the pass; 2 is an error and fails the step.
          leaked=0
          for container in $(docker compose -f docker-compose.yaml ps --all --format '{{.Name}}'); do
            if ! hits="$(docker logs "${container}" 2>&1 | { grep -cF -e "${former_secret}" || [ $? -eq 1 ]; })"; then
              echo "::error::could not read the logs of ${container}, so they could not be checked"
              exit 1
            fi
            hits="${hits:-0}"
            echo "${container}: ${hits} log line(s) carry the instance secret"
            if [ "${hits}" -ne 0 ]; then
              echo "::error::${container} logged the instance secret on ${hits} line(s); lines withheld"
              leaked=1
            fi
          done
          if [ "${leaked}" -ne 0 ]; then
            exit 1
          fi

          # (e) An unset secret must never mean allow-everything. Blank it -- the template's own
          # shipped state -- and recreate data_store alone; --no-deps leaves Postgres and
          # data_ingest as they are, and --wait holds until the new container is healthy. The
          # fake-mode overlay stays loaded (the set make system-launch started), so this `up` sees
          # the same model the stack runs and data_ingest can never come back on the production
          # entrypoint, even if --no-deps were ever lost.
          sed -i 's/^INSTANCE_WRITE_SECRET=.*/INSTANCE_WRITE_SECRET=/' .env
          docker compose -f docker-compose.yaml -f docker-compose.fake.yaml up -d --no-deps --force-recreate --wait --wait-timeout 180 data_store
          # Check the blanking reached the process, or every 401 below would prove nothing new.
          docker compose -f docker-compose.yaml exec -T data_store /code/.venv/bin/python -c \
            'import os, sys; sys.exit(1 if os.environ.get("INSTANCE_WRITE_SECRET") else 0)' \
            || { echo "::error::data_store still has a non-empty INSTANCE_WRITE_SECRET after recreation"; exit 1; }

          # Every write route, with every kind of header -- none, empty, arbitrary, and the
          # secret that was valid a minute ago -- must answer 401 with the fixed detail
          # (routers/common/instance_secret.py). The bodies are {} on purpose: the guard is a
          # route dependency and runs before body validation, so a route that lost it answers
          # 422 here and fails the check, and a probe can never write anything.
          #
          # THE DETAIL, NOT THE WHOLE BODY. This asserted the entire body until the typed-error
          # work wrapped every error in problem+json, which added type, title and status beside
          # detail and failed all twelve probes against a guard that was answering correctly.
          # The two properties this step owns are that the status is 401 -- not the 422 a route
          # that lost the dependency would give -- and that the message is the fixed one rather
          # than some other refusal. The envelope's own shape is pinned by the test suite, which
          # runs on every push; re-pinning it here only buys a second place to forget to update.
          want_detail='"detail":"Invalid or missing instance write secret"'
          # Sent from test_client by service name, like the Smoke Test: prod publishes no host
          # port. The client file is loaded for this request only; the blank and the recreate
          # above ran on docker-compose.yaml alone and never depended on it. The client's own
          # INSTANCE_WRITE_SECRET is interpolated blank now too, and it never sends it: the only
          # secret a probe carries is the header argument below, as before.
          base="http://data_store:${APP_INTERNAL_PORT}"
          failed=0
          probe() {
            method="$1"; path="$2"; label="$3"; shift 3
            response="$(docker compose -f docker-compose.yaml -f docker-compose.test-client.yaml \
              run --rm --no-deps -T --pull never --entrypoint curl test_client \
              -sS --max-time 20 -w '\n%{http_code}' -X "${method}" \
              -H 'Content-Type: application/json' "$@" "${base}${path}")" || {
              echo "::error::${method} ${path} (${label}): curl could not complete the request"
              failed=1; return 0; }
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [[ "${body}" == *"${former_secret}"* ]]; then
              echo "::error::${method} ${path} (${label}): HTTP ${status}, and the body carries the former secret (withheld)"
              failed=1
            elif [ "${status}" != "401" ] || [[ "${body}" != *"${want_detail}"* ]]; then
              echo "::error::${method} ${path} (${label}): expected 401 carrying ${want_detail}, got ${status} ${body}"
              failed=1
            else
              echo "${method} ${path} (${label}): 401"
            fi
          }
          arbitrary="$(openssl rand -hex 32)"
          for route in \
              "POST /store/stock/market-activity/LIFECYCLE" \
              "DELETE /store/00000000-0000-0000-0000-000000000000?owner=ci-secret-lifecycle" \
              "POST /internal/asset-data/stock/market-activity"; do
            method="${route%% *}"; path="${route#* }"
            data=()
            if [ "${method}" = "POST" ]; then data=(--data '{}'); fi
            probe "${method}" "${path}" "no header" "${data[@]}"
            probe "${method}" "${path}" "empty header" -H 'X-Instance-Secret;' "${data[@]}"
            probe "${method}" "${path}" "arbitrary header" -H "X-Instance-Secret: ${arbitrary}" "${data[@]}"
            probe "${method}" "${path}" "former secret" -H "X-Instance-Secret: ${former_secret}" "${data[@]}"
          done
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "Instance secret lifecycle passed: no log carries it, and with it unset every write is 401."

      - name: Dump Container Logs
        if: failure()
        run: |
          # Without this a --wait timeout is an opaque red X, and the cheapest way to make
          # an opaque red X go away is to delete --wait. Logs only: never `compose config`
          # here, which would interpolate POSTGRES_PASS straight into the build log.
          docker compose -f docker-compose.yaml ps --all
          docker compose -f docker-compose.yaml logs --tail 200 --no-color

      - name: Stop System
        if: always()
        # After the log dump on purpose -- `down -v` destroys the containers whose logs the
        # step above reads. This buys nothing on a runner that is discarded either way; it
        # is here so the invocation a human copies out of this job is one that does not
        # leave a stack and a Postgres volume behind on their machine.
        run: docker compose -f docker-compose.yaml down -v

      - name: Clean Runtime Configs
        if: always()
        run: |
          shred -u .env || rm -f .env
          shred -u server/data/ingest/.env || rm -f server/data/ingest/.env
          shred -u server/data/store/.env || rm -f server/data/store/.env

